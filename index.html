<style>
  :root{
    --paper:#F5F1E8;
    --paper-2:#EFE9DB;

    --accent:#B5472E;
    --accent-soft:#E4A88E;
    --line:#D9D1BE;
    --ok:#2F6B4E;
    --warn:#8A5A00;
  }
  html,body{background:var(--paper);color:var(--ink);}
  body{font-family:'Public Sans',ui-sans-serif,system-ui,sans-serif;font-feature-settings:"ss01","cv11";}
  .serif{font-family:'Fraunces',ui-serif,Georgia,serif;font-optical-sizing:auto;}
  .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;}
  .paper-grain{
    background-image:
      radial-gradient(rgba(27,28,34,.035) 1px, transparent 1px);
    background-size: 3px 3px;
  }
  .rule{border-color:var(--line);}
  .btn-accent{background:var(--accent);color:#F5F1E8;}
  .btn-accent:hover{background:#9B3B24;}
  .chip{border:1px solid var(--line);background:var(--paper-2);}
  select,input,textarea{
    background:var(--paper);border:1px solid var(--line);
    border-radius:4px;padding:.55rem .7rem;width:100%;
    font-family:inherit;font-size:.92rem;color:var(--ink);
    transition:border-color .15s,box-shadow .15s;
  }
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(181,71,46,.15);}
  textarea{min-height:5.5rem;resize:vertical;}
  .label{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;}
  .card{background:var(--paper);border:1px solid var(--line);}
  details>summary{list-style:none;cursor:pointer;}
  details>summary::-webkit-details-marker{display:none;}
  .marker::before{content:"§";color:var(--accent);margin-right:.4rem;font-family:'Fraunces',serif;}
  .fade-in{animation:fade .35s ease-out both;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .num{font-variant-numeric:tabular-nums;}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:.85rem 1rem;transition:all .15s;}
  .opt:hover{border-color:var(--accent);background:#fff;box-shadow:inset 3px 0 0 var(--accent);}
  .seg button{padding:.5rem .95rem;font-size:.82rem;background:var(--paper);}
  .seg button+button{border-left:1px solid var(--line);}
  .seg button.on{background:var(--ink);color:var(--paper);}
  table.mini{width:100%;font-size:.84rem;border-collapse:collapse;}
  table.mini th{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;}
  table.mini td,table.mini th{border-bottom:1px solid var(--line);padding:.5rem .5rem;text-align:left;vertical-align:top;}
  .hl{background:rgba(181,71,46,.09);}
  .spss-wrap{background:#fff;border:1px solid #cfcfcf;border-radius:4px;padding:.8rem;font-family:Arial,Helvetica,sans-serif;}
  .spss-cap{font-weight:700;text-align:center;font-size:.85rem;margin-bottom:.45rem;color:#000;}
  table.spss{border-collapse:collapse;font-size:.74rem;color:#111;margin:0 auto;}
  table.spss th{background:#f1f1f1;font-weight:400;border:1px solid #c8c8c8;padding:.3rem .45rem;text-align:center;vertical-align:bottom;}
  table.spss td{border:1px solid #e0e0e0;padding:.3rem .45rem;}
  table.spss td.rl{background:#f7f7f7;text-align:left;white-space:nowrap;}
  table.spss td.num-c{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  table.spss td.wrap{text-align:left;min-width:11rem;}
  .spss-foot{font-size:.7rem;color:#333;margin-top:.45rem;line-height:1.5;}
  .mk{background:#FFE7A0 !important;}
  .badge{display:inline-flex;align-items:center;justify-content:center;min-width:1.15rem;height:1.15rem;border-radius:999px;background:var(--accent);color:#fff;font-size:.65rem;font-family:'JetBrains Mono',monospace;margin-left:.3rem;vertical-align:middle;padding:0 .25rem;flex-shrink:0;line-height:1;}
  li > .badge{margin-left:0;margin-top:.15rem;}
  @media print{
    .no-print{display:none!important;}
    body{background:#fff;}
    .card{border-color:#ccc;}
  }
</style>

const getOpts = (st, s) => typeof st.options === "function" ? st.options(s) : st.options;
const getText = (v, s) => typeof v === "function" ? v(s) : v;
const optLabel = (st, s, v) => (getOpts(st, s).find(o => o.value === v) || {}).label || v;

function resolve(raw) {
  const clean = {};
  if (raw.objective === "asociacion_cat") clean.dvType = "nominal";
  if (raw.objective === "supervivencia") clean.dvType = "tiempo";
  if (raw.objective === "multivariante") { clean.dvType = "continua"; clean.multipleDV = "si"; }
  const steps = [];
  for (const st of STEPS) {
    if (st.when(clean)) {
      steps.push(st);
      const v = raw[st.field];
      if (v && getOpts(st, clean).some(o => o.value === v)) clean[st.field] = v;
    }
  }
  return { clean, steps };
}

/* ============================================================
   MOTOR DE SUGERENCIAS (v3)
   ============================================================ */
function suggestTests(s) {
  const out = [];
  const push = (key, why, level = "principal") => { if (!out.find(o => o.key === key)) out.push({ key, why, level }); };
  const { objective, dvType, ivCount, design, normality, equalVar, hasCovariates, sample, multipleDV, expectedFreq, tableSize, nPred } = s;

  const nonNormal = normality === "no";
  const paired = design === "pareados" || design === "mixto";
  const small = sample === "lt30";
  const robust = ["30to50", "50to300", "gt300"].includes(sample);
  const lowExp = expectedFreq === "bajo";
  const chi = (why, isRxC) => {
    if (lowExp) {
      push("fisher", isRxC
        ? "Frecuencias esperadas bajas en tabla R×C: usa la exacta de Fisher-Freeman-Halton o agrupa categorías con sentido teórico."
        : "Frecuencias esperadas bajas en tabla 2×2: la exacta de Fisher es la opción correcta.");
      push("chi_independencia", isRxC
        ? "Solo si agrupas categorías y entonces se cumplen las frecuencias esperadas."
        : "No recomendable con esperadas < 5; se muestra como referencia.", "alternativa");
    } else {
      push("chi_independencia", why);
      if (expectedFreq === "nose") push("fisher", "Si al revisar la tabla encuentras esperadas < 5, cambia a Fisher.", "alternativa");
    }
  };

  // ── UNA MUESTRA ───────────────────────────────────────────
  if (objective === "una_muestra") {
    if (dvType === "continua") {
      if (nonNormal && !robust) push("wilcoxon_una_muestra", "Comparas con un valor de referencia y la distribución no es normal con n pequeño.");
      else push("t_una_muestra", nonNormal
        ? "Con n ≥ 30 la t es robusta a desviaciones moderadas de la normalidad (teorema del límite central)."
        : "Comparas una media con un valor teórico o poblacional conocido.");
      if (nonNormal && robust) push("wilcoxon_una_muestra", "Prefiérela si la asimetría es severa o hay atípicos extremos.", "alternativa");
      if (!nonNormal && small) push("wilcoxon_una_muestra", "Con n < 30, contrasta con la alternativa no paramétrica.", "alternativa");
    } else if (dvType === "ordinal") {
      push("wilcoxon_una_muestra", "Con VD ordinal, compara la mediana con un valor hipotético.");
    } else if (dvType === "dicotomica") {
      push("z_proporciones", "Evalúa si la proporción observada difiere de un valor teórico (prueba binomial / Z).");
    } else if (dvType === "nominal") {
      push("chi_bondad", lowExp
        ? "Con esperadas bajas, agrupa categorías con sentido teórico antes de aplicarla."
        : "Comparas la distribución observada de categorías con proporciones esperadas.");
    }
  }

  // ── COMPARAR / CAMBIO ─────────────────────────────────────
  if (objective === "comparar" || objective === "cambio") {
    const isChange = objective === "cambio" || paired;

    if (dvType === "continua") {
      if (ivCount === "factorial") {
        if (design === "mixto") push("modelo_mixto", "Combinas un factor entre grupos y otro intra-sujetos (ANOVA mixto / modelo lineal mixto).");
        else if (design === "pareados") push("rm_anova", "Dos o más factores intra-sujetos: ANOVA factorial de medidas repetidas.");
        else push("anova_factorial", "Dos o más factores cruzados: evalúa efectos principales e interacción.");
        if (multipleDV === "si") push("manova", "Con varias VDs continuas relacionadas, MANOVA es la extensión natural.", "alternativa");
        if (hasCovariates === "si") push("ancova", "Añade covariables continuas para controlar varianza residual.", "alternativa");
        if (nonNormal && !robust) push("modelo_mixto", "Con no normalidad y n pequeño, considera modelos robustos o transformar la VD.", "alternativa");
      } else if (ivCount === "2") {
        if (isChange) {
          if (nonNormal && !robust) {
            push("wilcoxon_pareado", "Dos mediciones relacionadas con diferencias no normales y n pequeño.");
            push("signos", "Si las diferencias tampoco son simétricas.", "alternativa");
          } else {
            push("t_pareada", nonNormal
              ? "Con n ≥ 30 la t pareada es robusta a desviaciones moderadas (teorema del límite central)."
              : "Comparas dos mediciones en las mismas personas (pre-post o dos condiciones).");
            if (nonNormal || small) push("wilcoxon_pareado", "Contrasta con la alternativa no paramétrica.", "alternativa");
          }
        } else {
          if (nonNormal && !robust) {
            push("mann_whitney", "Dos grupos independientes con VD no normal y n pequeño.");
          } else if (nonNormal) {
            push("t_welch", "Con n ≥ 30 por grupo, la t de Welch es robusta a no normalidad moderada y no exige varianzas iguales.");
            push("mann_whitney", "Prefiérela si hay asimetría severa o atípicos extremos.", "alternativa");
          } else if (equalVar === "no") {
            push("t_welch", "Dos grupos independientes con varianzas desiguales.");
            push("mann_whitney", "Alternativa no paramétrica robusta.", "alternativa");
          } else {
            push("t_independientes", "Dos grupos independientes con VD continua y supuestos razonables.");
            if (equalVar === "nose") push("t_welch", "Si no verificaste Levene, Welch es la opción segura: no asume varianzas iguales.", "alternativa");
            if (small) push("mann_whitney", "Con n < 30, contrasta con la alternativa no paramétrica.", "alternativa");
          }
          if (hasCovariates === "si") push("ancova", "Controla covariables continuas (edad, puntaje basal).", "alternativa");
        }
      } else if (ivCount === "3+") {
        if (isChange) {
          if (nonNormal && !robust) push("friedman", "Tres o más mediciones relacionadas con VD no normal y n pequeño.");
          else {
            push("rm_anova", "Tres o más mediciones o condiciones en las mismas personas.");
            if (nonNormal) push("friedman", "Prefiérela si la asimetría es severa.", "alternativa");
          }
          if (design === "mixto") push("modelo_mixto", "Si además tienes un factor entre sujetos, un modelo mixto es lo apropiado.", "alternativa");
        } else {
          if (nonNormal && !robust) push("kruskal_wallis", "Tres o más grupos independientes con VD no normal y n pequeño.");
          else if (nonNormal) {
            push("welch_anova", "Con n ≥ 30 por grupo, el ANOVA de Welch tolera no normalidad moderada y varianzas desiguales.");
            push("kruskal_wallis", "Prefiérela si la asimetría es severa o hay atípicos extremos.", "alternativa");
          } else if (equalVar === "no") {
            push("welch_anova", "ANOVA robusto a la heterogeneidad de varianzas.");
            push("kruskal_wallis", "Alternativa no paramétrica.", "alternativa");
          } else {
            push("anova_una_via", "Tres o más grupos independientes con VD continua y supuestos razonables.");
            if (equalVar === "nose") push("welch_anova", "Si no verificaste Levene, Welch es la opción segura.", "alternativa");
          }
          if (hasCovariates === "si") push("ancova", "Controla covariables continuas relevantes (edad, puntaje basal).", "alternativa");
        }
      }
    }

    if (dvType === "ordinal") {
      if (ivCount === "2") push(isChange ? "wilcoxon_pareado" : "mann_whitney", "VD ordinal con dos grupos o condiciones.");
      else if (ivCount === "3+") push(isChange ? "friedman" : "kruskal_wallis", "VD ordinal con tres o más grupos o condiciones.");
      else if (ivCount === "factorial") {
        push("reg_logistica_ord", "Con varios factores y VD ordinal, la regresión ordinal permite evaluar efectos e interacción.");
        push("modelo_mixto", "Si hay medidas repetidas, considera modelos mixtos ordinales.", "alternativa");
      }
    }

    if (dvType === "dicotomica") {
      if (ivCount === "factorial") push("reg_logistica_bin", "Con varios factores y VD dicotómica, la logística binaria evalúa efectos e interacción.");
      else if (isChange && ivCount === "2") push("mcnemar", "Variable dicotómica medida dos veces en las mismas personas.");
      else if (isChange && ivCount === "3+") push("cochran_q", "Tres o más mediciones dicotómicas en las mismas personas.");
      else if (ivCount === "2") {
        chi("Comparas una proporción entre dos grupos independientes (tabla 2×2).", false);
        if (!lowExp) push("z_proporciones", "Equivale a χ² 2×2; útil para interpretar la diferencia de proporciones.", "alternativa");
      } else if (ivCount === "3+") chi("Comparas una proporción entre tres o más grupos independientes.", true);
    }

    if (dvType === "nominal") {
      if (ivCount === "factorial") push("reg_logistica_multi", "Con varios factores y VD nominal, la logística multinomial evalúa sus efectos.");
      else if (isChange) push("mcnemar", "Categorías medidas dos veces en las mismas personas (McNemar-Bowker si hay 3+ categorías).");
      else chi("Comparas la distribución de categorías entre grupos.", true);
    }

    if (dvType === "conteo") {
      push("poisson", "Modela el conteo en función del grupo; permite comparar tasas.");
      push("bin_negativa", "Si hay sobredispersión (varianza > media), preferir binomial negativa.", "alternativa");
    }
  }

  // ── RELACIONAR ────────────────────────────────────────────
  if (objective === "relacion") {
    if (dvType === "continua") {
      if (nonNormal) {
        push("spearman", "Relación monotónica entre variables cuantitativas con distribución no normal o atípicos.");
        push("kendall", "Alternativa robusta, especialmente con n pequeño o muchos empates.", "alternativa");
      } else {
        push("pearson", "Relación lineal entre dos variables cuantitativas.");
        push("spearman", "Contrasta con la versión por rangos si sospechas no linealidad o atípicos.", "alternativa");
      }
      if (hasCovariates === "si") push("parcial", "Controla el efecto de una tercera variable continua.", "alternativa");
    } else if (dvType === "ordinal") {
      push(small ? "kendall" : "spearman", "Al menos una variable es ordinal.");
      push(small ? "spearman" : "kendall", "Kendall es preferible con muestras pequeñas o muchos empates.", "alternativa");
    } else if (dvType === "dicotomica") {
      push("punto_biserial", "Relación entre una variable dicotómica y una continua.");
    } else if (dvType === "nominal") {
      chi("Asociación entre variables categóricas; usa V de Cramer como tamaño de efecto.", tableSize === "rxc");
    }
  }

  // ── PREDECIR ──────────────────────────────────────────────
  if (objective === "predecir") {
    if (dvType === "continua") {
      if (nPred === "varios") {
        push("reg_lineal_multiple", "VD continua con dos o más predictores.");
        if (hasCovariates === "si") push("reg_jerarquica", "Introduce primero las covariables y luego tus predictores de interés para ver su aporte incremental (ΔR²).", "alternativa");
      } else {
        push("reg_lineal_simple", "VD continua y un predictor.");
        if (hasCovariates === "si") push("reg_jerarquica", "Para evaluar el predictor después de controlar covariables.", "alternativa");
      }
    } else if (dvType === "dicotomica") push("reg_logistica_bin", "VD con dos categorías (presencia/ausencia, caso/control).");
    else if (dvType === "nominal") push("reg_logistica_multi", "VD con tres o más categorías sin orden.");
    else if (dvType === "ordinal") push("reg_logistica_ord", "VD con categorías ordenadas; verifica odds proporcionales.");
    else if (dvType === "conteo") {
      push("poisson", "Conteo de eventos por unidad de tiempo o persona.");
      push("bin_negativa", "Si la varianza supera a la media (sobredispersión).", "alternativa");
    } else if (dvType === "tiempo") {
      push("cox", "Efecto de predictores sobre el riesgo de un evento.");
      push("kaplan_meier", "Descripción y comparación de curvas por grupos (log-rank).", "alternativa");
    }
  }

  if (objective === "asociacion_cat") chi("Asociación entre dos variables categóricas.", tableSize === "rxc");

  if (objective === "supervivencia") {
    push("kaplan_meier", "Curvas de supervivencia y comparación entre grupos (log-rank).");
    push("cox", "Modelo multivariado para cuantificar el efecto de predictores.", "alternativa");
  }

  if (objective === "multivariante") {
    push("manova", "Varias VDs continuas con uno o más factores.");
    if (hasCovariates === "si") push("ancova", "Con covariables, la extensión es MANCOVA (mismo menú Multivariante, añadiendo covariables).", "alternativa");
  }

  if (out.length === 0) push("manual", "La combinación actual es ambigua o requiere más detalle metodológico.");
  return out;
}

/* ============================================================
   REGLAS DE NORMALIDAD SEGÚN n
   ============================================================ */
const NORM_RANGES = [
  { key: "lt30", label: "n < 30", test: "Shapiro-Wilk",
    detail: "Es la más potente con muestras pequeñas, pero aun así tiene poca potencia: un p > .05 no garantiza normalidad. Compleméntala con el gráfico Q-Q y la z de asimetría y curtosis.",
    z: "|z| < 1.96" },
  { key: "30to50", label: "30 ≤ n < 50", test: "Shapiro-Wilk",
    detail: "Sigue siendo la prueba de elección. Revisa también el Q-Q y la z de asimetría y curtosis.",
    z: "|z| < 1.96" },
  { key: "50to300", label: "50 ≤ n ≤ 300", test: "Shapiro-Wilk o K-S con corrección de Lilliefors",
    detail: "Shapiro-Wilk sigue siendo válida (SPSS la calcula hasta n = 5000). Kolmogorov-Smirnov solo con la corrección de Lilliefors.",
    z: "|z| < 3.29" },
  { key: "gt300", label: "n > 300", test: "Gráficos + valores absolutos",
    detail: "Las pruebas formales detectan desviaciones triviales y casi siempre salen significativas. Decide con histograma y Q-Q.",
    z: "|asimetría| ≤ 2 y |curtosis| ≤ 7" },
];

function normalityWhere(s) {
  if (s.objective === "predecir") return "En los residuos del modelo (Regresión → Guardar → Residuos tipificados; luego Explorar sobre esa nueva variable).";
  if (s.design === "mixto" || s.ivCount === "factorial") return "En cada combinación de grupo y condición, o en los residuos del modelo.";
  if (s.objective === "cambio" || s.design === "pareados") return "En las diferencias entre mediciones (Transformar → Calcular variable: post − pre) y luego Explorar sobre esa variable.";
  if (s.objective === "comparar" && s.design === "independientes") return "Dentro de cada grupo por separado (Explorar → poner la VI en 'Lista de factores').";
  if (s.objective === "relacion") return "En cada una de las dos variables; revisa también el diagrama de dispersión (linealidad y atípicos).";
  if (s.objective === "multivariante") return "En cada VD dentro de cada grupo (normalidad multivariante: revisa también distancias de Mahalanobis).";
  return "En la variable de interés.";
}

function NormalityInline({ s }) {
  const r = NORM_RANGES.find(x => x.key === s.sample);
  return (
    <div className="space-y-1">
      {r ? (
        <div>Con <b>{r.label}</b> usa <b>{r.test}</b>; criterio complementario: <span className="mono">{r.z}</span>.</div>
      ) : (
        <div>Como no conoces tu n, revisa la tabla de normalidad en la sección de supuestos.</div>
      )}
      <div><span className="serif italic">Dónde evaluarla:</span> {normalityWhere(s)}</div>
    </div>
  );
}

/* ============================================================
   POST HOC
   ============================================================ */
function postHocAdvice(s, results) {
  const p = results[0] && results[0].level === "principal" ? results[0].key : null;
  const goal = s.postHocGoal;
  const items = [];
  const add = (name, when, spss, rec = false) => items.push({ name, when, spss, rec });
  let title = "";

  if (p === "anova_una_via") {
    title = "Después del ANOVA de un factor";
    if (goal === "control") add("Dunnett", "Comparas cada grupo solo contra el control: menos comparaciones, más potencia.", "ANOVA de un factor → Post hoc → Dunnett → elegir la categoría de control (primera o última)", true);
    if (goal === "planeadas") add("Contrastes planeados (o Bonferroni / Holm)", "Pocas hipótesis específicas definidas antes de ver los datos.", "ANOVA de un factor → Contrastes (coeficientes), o Post hoc → Bonferroni", true);
    if (s.equalN === "no") {
      add("Gabriel", "Varianzas iguales y tamaños de grupo ligeramente distintos.", "ANOVA de un factor → Post hoc → Gabriel", !goal || goal === "todas");
      add("Hochberg GT2", "Varianzas iguales y tamaños de grupo muy distintos.", "ANOVA de un factor → Post hoc → GT2 de Hochberg");
    } else {
      add("Tukey HSD", "Todas las comparaciones por pares con varianzas y tamaños similares.", "ANOVA de un factor → Post hoc → Tukey", !goal || goal === "todas");
    }
    add("Games-Howell", "Si Levene resulta significativa o tienes dudas sobre las varianzas.", "ANOVA de un factor → Post hoc → Games-Howell");
  } else if (p === "welch_anova") {
    title = "Después del ANOVA de Welch";
    if (goal === "control") add("T3 de Dunnett", "Comparaciones contra control con varianzas desiguales.", "ANOVA de un factor → Post hoc → T3 de Dunnett", true);
    add("Games-Howell", "No asume varianzas ni tamaños iguales; la opción estándar tras Welch.", "ANOVA de un factor → Post hoc → Games-Howell", goal !== "control");
  } else if (p === "kruskal_wallis") {
    title = "Después de Kruskal-Wallis";
    add("Dunn con ajuste de Bonferroni (o Holm)", "Comparaciones por pares basadas en rangos.", "Pruebas no paramétricas → Muestras independientes → en el Visor de modelos, 'Comparaciones por parejas'", true);
    if (goal === "control") add("U de Mann-Whitney contra el control", "Solo k − 1 comparaciones; ajusta α dividiendo entre k − 1.", "Pruebas no paramétricas → Muestras independientes, un par a la vez");
  } else if (p === "rm_anova") {
    title = "Después del ANOVA de medidas repetidas";
    add("Comparaciones por pares con Bonferroni", "Compara las medias marginales de cada momento o condición.", "Medidas repetidas → Medias marginales estimadas → Comparar efectos principales → Ajuste: Bonferroni", true);
    if (goal === "planeadas" || goal === "control") add("Contrastes (simple, repetido, polinómico)", "Simple: cada momento vs. basal; repetido: cada momento vs. el anterior; polinómico: tendencias.", "Medidas repetidas → Contrastes");
  } else if (p === "friedman") {
    title = "Después de Friedman";
    add("Dunn-Bonferroni por pares", "Comparaciones por pares basadas en rangos.", "Pruebas no paramétricas → Muestras relacionadas → Visor de modelos → 'Comparaciones por parejas'", true);
    add("Wilcoxon por pares con Bonferroni", "Alternativa manual; divide α entre el número de comparaciones.", "Pruebas no paramétricas → Muestras relacionadas, un par a la vez");
  } else if (p === "anova_factorial" || (p === "modelo_mixto" && s.ivCount === "factorial") || (p === "rm_anova" && s.ivCount === "factorial")) {
    title = "Después de un diseño factorial";
    add("Efectos simples", "Si la interacción es significativa, analiza el efecto de un factor dentro de cada nivel del otro, antes que los efectos principales.", "Sintaxis: /EMMEANS=TABLES(A*B) COMPARE(A) ADJ(BONFERRONI)", true);
    add("Post hoc en efectos principales", "Solo si la interacción no es significativa y el factor tiene 3+ niveles (Tukey o Games-Howell).", "Univariante → Post hoc");
  } else if (p === "cochran_q") {
    title = "Después de la Q de Cochran";
    add("McNemar por pares con Bonferroni", "Compara cada par de mediciones dicotómicas.", "Pruebas no paramétricas → Muestras relacionadas, un par a la vez", true);
  } else if ((p === "chi_independencia" || p === "fisher") && (s.tableSize === "rxc" || s.ivCount === "3+")) {
    title = "Después de χ² en tablas R×C";
    add("Residuos tipificados corregidos", "Indican qué celdas se alejan de lo esperado: |z| > 1.96 (p < .05).", "Tablas cruzadas → Casillas → Residuos: 'Tipificados corregidos'", true);
    add("Comparar proporciones de columna", "Pruebas z por pares con ajuste de Bonferroni (letras de subíndice).", "Tablas cruzadas → Casillas → 'Comparar las proporciones de columna' + 'Ajustar valores p (Bonferroni)'");
  }

  if (!items.length) return null;
  return {
    title, items,
    notes: [
      "Aplica las pruebas post hoc solo si la prueba global (ómnibus) es significativa; los contrastes planeados pueden hacerse aunque no lo sea.",
      "Con k grupos hay k(k − 1)/2 comparaciones por pares: Bonferroni usa α / número de comparaciones; Holm es menos conservador."
    ]
  };
}

/* ============================================================
   RUTA DE ANÁLISIS (orden de decisiones)
   ============================================================ */
function buildRoadmap(s, results) {
  const steps = [];
  const add = (title, detail) => steps.push({ title, detail });
  const main = results.find(r => r.level === "principal");
  const t = main ? TESTS[main.key] : null;
  const keys = results.map(r => r.key);
  const indepComp = s.objective === "comparar" && s.design === "independientes" && s.dvType === "continua";

  add("Depura y explora tus datos", "Errores de captura, valores perdidos y atípicos (Explorar → diagramas de caja; puntajes z mayores que |3.29|).");

  if (contPath(s)) {
    const r = NORM_RANGES.find(x => x.key === s.sample);
    add("Evalúa la normalidad", `${r ? `Con ${r.label}: ${r.test} (criterio complementario ${r.z}). ` : "Elige la prueba según tu n (ver tabla de normalidad). "}${normalityWhere(s)}`);
  }
  if (indepComp && s.normality !== "no" && ["2", "3+", "factorial"].includes(s.ivCount)) {
    add("Evalúa la homogeneidad de varianzas (Levene)", "p > .05 → asume varianzas iguales. p ≤ .05 → usa la versión de Welch" + (s.ivCount === "3+" ? " y Games-Howell como post hoc." : "."));
  }
  if (isChiPath(s)) {
    add("Revisa las frecuencias esperadas", "Ninguna < 1 y no más del 20% de celdas < 5 (Cochran). Si no se cumple: Fisher (2×2), Fisher-Freeman-Halton o agrupar categorías (R×C).");
  }
  if (keys.includes("ancova") && s.hasCovariates === "si") {
    add("Verifica los supuestos de la covariable", "Relación lineal covariable–VD y homogeneidad de pendientes (interacción factor × covariable no significativa).");
  }
  if (main && main.key === "rm_anova") {
    add("Revisa la esfericidad (Mauchly)", "Si p ≤ .05, corrige los grados de libertad: Greenhouse-Geisser (ε < .75) o Huynh-Feldt (ε ≥ .75).");
  }
  if (t && main.key !== "manual") add(`Aplica la prueba principal: ${t.name}`, main.why);
  if (s.ivCount === "factorial") add("Interpreta primero la interacción", "Si es significativa, analiza efectos simples; los efectos principales pueden ser engañosos.");
  if (main && ["reg_lineal_simple", "reg_lineal_multiple", "reg_jerarquica"].includes(main.key)) {
    add("Diagnostica el modelo", "Normalidad de residuos, homocedasticidad (gráfico ZRESID vs. ZPRED), multicolinealidad (VIF < 10), independencia (Durbin-Watson ≈ 2) y casos influyentes (Cook < 1).");
  }
  if (main && ["reg_logistica_bin", "reg_logistica_multi", "reg_logistica_ord"].includes(main.key)) {
    add("Evalúa el ajuste del modelo", "Hosmer-Lemeshow (binaria), pseudo R², tabla de clasificación y multicolinealidad; en ordinal, el test de líneas paralelas.");
  }
  const ph = postHocAdvice(s, results);
  if (ph) {
    const rec = ph.items.find(i => i.rec) || ph.items[0];
    add("Si p ≤ α, haz las comparaciones posteriores", `${rec.name}. ${rec.when}`);
  }
  if (t && t.effect && t.effect !== "—") add("Calcula el tamaño de efecto", `${t.effect}, con su intervalo de confianza al 95%.`);
  add("Reporta en formato APA 7", "Estadístico, grados de libertad, p exacta (p = .032, o p < .001), tamaño de efecto e IC 95%, además de los descriptivos por grupo.");
  return steps;
}

/* ============================================================
   GENERADOR DE HIPÓTESIS
   ============================================================ */
function getLabelNames(state) {
  const { objective, design } = state;
  const paired = design === "pareados" || design === "mixto";
  if (objective === "una_muestra")   return { a: "Tu variable", b: "Valor teórico", aPh: "Ej.: estrés percibido / glucosa en ayuno", bPh: "Ej.: 50 (norma poblacional)" };
  if (objective === "relacion")       return { a: "Variable X", b: "Variable Y", aPh: "Ej.: horas de sueño / IMC", bPh: "Ej.: rendimiento académico / presión arterial" };
  if (objective === "predecir")       return { a: "Predictor (X)", b: "Variable a predecir (Y)", aPh: "Ej.: carga laboral", bPh: "Ej.: burnout" };
  if (objective === "asociacion_cat") return { a: "Variable categórica 1", b: "Variable categórica 2", aPh: "Ej.: sexo", bPh: "Ej.: especialidad elegida" };
  if (objective === "supervivencia")  return { a: "Grupo 1", b: "Grupo 2", aPh: "Ej.: tratamiento A", bPh: "Ej.: tratamiento B" };
  if (objective === "multivariante")  return { a: "Grupo 1", b: "Grupo 2", aPh: "Ej.: experimental", bPh: "Ej.: control" };
  if (paired) return { a: "Momento / condición 1", b: "Momento / condición 2", aPh: "Ej.: pre-test", bPh: "Ej.: post-test" };
  return { a: "Grupo 1", b: "Grupo 2", aPh: "Ej.: turno nocturno", bPh: "Ej.: turno diurno" };
}

function buildHypotheses(state, labels) {
  const { objective, dvType, ivCount, design, normality } = state;
  if (!objective || !dvType) return null;
  const A = labels.a || "A";
  const B = labels.b || "B";
  const paired = design === "pareados" || design === "mixto";
  const nonNormal = normality === "no";

  // UNA MUESTRA
  if (objective === "una_muestra") {
    if (dvType === "continua" && !nonNormal) return {
      parameter: "μ (media poblacional)",
      h0: { notation: "μ = μ₀", prose: `La media de ${A} es igual al valor teórico (μ₀).` },
      alternatives: [
        { id: "bilateral", notation: "μ ≠ μ₀", prose: `La media de ${A} difiere del valor teórico.` },
        { id: "greater",   notation: "μ > μ₀", prose: `La media de ${A} es mayor al valor teórico.` },
        { id: "less",      notation: "μ < μ₀", prose: `La media de ${A} es menor al valor teórico.` },
      ]};
    if (dvType === "continua" && nonNormal) return {
      parameter: "Mdn (mediana)",
      h0: { notation: "Mdn = Mdn₀", prose: `La mediana de ${A} es igual al valor teórico.` },
      alternatives: [
        { id: "bilateral", notation: "Mdn ≠ Mdn₀", prose: `La mediana de ${A} difiere del valor teórico.` },
        { id: "greater",   notation: "Mdn > Mdn₀", prose: `La mediana de ${A} es mayor al valor teórico.` },
        { id: "less",      notation: "Mdn < Mdn₀", prose: `La mediana de ${A} es menor al valor teórico.` },
      ]};
    if (dvType === "dicotomica") return {
      parameter: "p (proporción)",
      h0: { notation: "p = p₀", prose: `La proporción en ${A} iguala al valor teórico.` },
      alternatives: [
        { id: "bilateral", notation: "p ≠ p₀", prose: `La proporción difiere del valor teórico.` },
        { id: "greater",   notation: "p > p₀", prose: `La proporción es mayor al valor teórico.` },
        { id: "less",      notation: "p < p₀", prose: `La proporción es menor al valor teórico.` },
      ]};
    if (dvType === "nominal") return {
      parameter: "π_i (proporciones por categoría)",
      h0: { notation: "π_i = π_i0  para toda i", prose: `La distribución de ${A} coincide con las proporciones esperadas.` },
      alternatives: [
        { id: "bilateral", notation: "∃ i : π_i ≠ π_i0", prose: `Al menos una categoría de ${A} difiere de lo esperado.` },
      ]};
  }

  // COMPARAR / CAMBIO
  if (objective === "comparar" || objective === "cambio") {
    if (ivCount === "factorial") return {
      parameter: "Efectos del modelo factorial",
      h0: { notation: "α_i = 0,  β_j = 0,  (αβ)_ij = 0", prose: `No hay efecto del factor A, ni del factor B, ni de la interacción A×B sobre la VD.` },
      alternatives: [
        { id: "bilateral", notation: "al menos un efecto ≠ 0", prose: `Al menos uno de los efectos principales o la interacción es distinto de cero.` },
      ]};

    if (ivCount === "3+") {
      if (dvType === "continua" && !nonNormal) return {
        parameter: paired ? "μ_k (medias en k condiciones)" : "μ_k (medias en k grupos)",
        h0: { notation: "μ₁ = μ₂ = … = μ_k", prose: paired ? `Las medias son iguales en todas las condiciones/momentos.` : `Las medias son iguales en todos los grupos.` },
        alternatives: [
          { id: "bilateral", notation: "∃ i, j : μ_i ≠ μ_j", prose: `Al menos un par de medias difiere (ANOVA es ómnibus; luego se usan post hoc).` },
        ]};
      if (dvType === "continua" && nonNormal) return {
        parameter: "Distribución / rangos medios",
        h0: { notation: "F₁ = F₂ = … = F_k", prose: `Las distribuciones son iguales en todos los grupos/condiciones.` },
        alternatives: [
          { id: "bilateral", notation: "al menos una F_i ≠", prose: `Al menos una distribución (o rango medio) difiere del resto.` },
        ]};
      if (dvType === "ordinal") return {
        parameter: "Rango medio",
        h0: { notation: "R̄₁ = R̄₂ = … = R̄_k", prose: `Los rangos medios son iguales en todos los grupos/condiciones.` },
        alternatives: [
          { id: "bilateral", notation: "al menos un R̄_i ≠", prose: `Al menos un grupo difiere en su rango medio.` },
        ]};
      if (dvType === "dicotomica" && paired) return {
        parameter: "Proporciones en k momentos",
        h0: { notation: "p₁ = p₂ = … = p_k", prose: `La proporción del evento es igual en todas las mediciones.` },
        alternatives: [
          { id: "bilateral", notation: "al menos una p_i ≠", prose: `Al menos una proporción difiere entre momentos.` },
        ]};
      if (dvType === "dicotomica" || dvType === "nominal") return {
        parameter: "Independencia",
        h0: { notation: "VD ⊥ Grupo", prose: `La distribución de la VD es independiente del grupo.` },
        alternatives: [
          { id: "bilateral", notation: "VD no es independiente de Grupo", prose: `La distribución de la VD difiere entre grupos.` },
        ]};
    }

    if (ivCount === "2") {
      if (paired || objective === "cambio") {
        if (dvType === "continua" && !nonNormal) return {
          parameter: "μ_d (media de las diferencias)",
          h0: { notation: "μ_d = 0", prose: `No hay cambio entre ${A} y ${B} (promedio de diferencias = 0).` },
          alternatives: [
            { id: "bilateral", notation: "μ_d ≠ 0", prose: `Hay cambio entre ${A} y ${B} (sin dirección específica).` },
            { id: "greater",   notation: "μ_d > 0", prose: `La media en ${A} es mayor que en ${B}.` },
            { id: "less",      notation: "μ_d < 0", prose: `La media en ${A} es menor que en ${B}.` },
          ]};
        if (dvType === "continua" && nonNormal) return {
          parameter: "Mdn_d (mediana de las diferencias)",
          h0: { notation: "Mdn_d = 0", prose: `La distribución de diferencias entre ${A} y ${B} está centrada en cero.` },
          alternatives: [
            { id: "bilateral", notation: "Mdn_d ≠ 0", prose: `Las diferencias se inclinan sistemáticamente en alguna dirección.` },
            { id: "greater",   notation: "Mdn_d > 0", prose: `${A} tiende a ser mayor que ${B}.` },
            { id: "less",      notation: "Mdn_d < 0", prose: `${A} tiende a ser menor que ${B}.` },
          ]};
        if (dvType === "ordinal") return {
          parameter: "Rangos con signo",
          h0: { notation: "Mdn(A − B) = 0", prose: `No hay diferencia sistemática en rangos entre ${A} y ${B}.` },
          alternatives: [
            { id: "bilateral", notation: "Mdn(A − B) ≠ 0", prose: `Hay diferencia sistemática entre ${A} y ${B}.` },
            { id: "greater",   notation: "Mdn(A − B) > 0", prose: `${A} tiende a rangos mayores que ${B}.` },
            { id: "less",      notation: "Mdn(A − B) < 0", prose: `${A} tiende a rangos menores que ${B}.` },
          ]};
        if (dvType === "dicotomica") return {
          parameter: "Proporciones de cambio (McNemar)",
          h0: { notation: "p₁₂ = p₂₁", prose: `Los cambios entre ${A} y ${B} son simétricos: no hay cambio neto.` },
          alternatives: [
            { id: "bilateral", notation: "p₁₂ ≠ p₂₁", prose: `Hay un cambio sistemático de una categoría a otra entre ${A} y ${B}.` },
          ]};
      } else {
        if (dvType === "continua" && !nonNormal) return {
          parameter: "μ (media poblacional)",
          h0: { notation: `μ_{${A}} = μ_{${B}}`, prose: `Las medias de ${A} y ${B} son iguales.` },
          alternatives: [
            { id: "bilateral", notation: `μ_{${A}} ≠ μ_{${B}}`, prose: `Las medias de ${A} y ${B} difieren.` },
            { id: "greater",   notation: `μ_{${A}} > μ_{${B}}`, prose: `${A} tiene mayor media que ${B}.` },
            { id: "less",      notation: `μ_{${A}} < μ_{${B}}`, prose: `${A} tiene menor media que ${B}.` },
          ]};
        if (dvType === "continua" && nonNormal) return {
          parameter: "Distribución (Mann-Whitney)",
          h0: { notation: `F_{${A}} = F_{${B}}`, prose: `Las distribuciones de ${A} y ${B} son iguales.` },
          alternatives: [
            { id: "bilateral", notation: `F_{${A}} ≠ F_{${B}}`, prose: `Las distribuciones difieren entre grupos.` },
            { id: "greater",   notation: `P(X_{${A}} > X_{${B}}) > 0.5`, prose: `Los valores en ${A} tienden a ser mayores que en ${B}.` },
            { id: "less",      notation: `P(X_{${A}} > X_{${B}}) < 0.5`, prose: `Los valores en ${A} tienden a ser menores que en ${B}.` },
          ]};
        if (dvType === "ordinal") return {
          parameter: "Rango medio",
          h0: { notation: `R̄_{${A}} = R̄_{${B}}`, prose: `Los rangos medios en ${A} y ${B} son iguales.` },
          alternatives: [
            { id: "bilateral", notation: `R̄_{${A}} ≠ R̄_{${B}}`, prose: `Los rangos medios difieren.` },
            { id: "greater",   notation: `R̄_{${A}} > R̄_{${B}}`, prose: `${A} tiende a puntajes más altos que ${B}.` },
            { id: "less",      notation: `R̄_{${A}} < R̄_{${B}}`, prose: `${A} tiende a puntajes más bajos que ${B}.` },
          ]};
        if (dvType === "dicotomica") return {
          parameter: "p (proporción del evento)",
          h0: { notation: `p_{${A}} = p_{${B}}`, prose: `La proporción del evento es igual en ${A} y ${B}.` },
          alternatives: [
            { id: "bilateral", notation: `p_{${A}} ≠ p_{${B}}`, prose: `Las proporciones difieren entre ${A} y ${B}.` },
            { id: "greater",   notation: `p_{${A}} > p_{${B}}`, prose: `${A} presenta mayor proporción del evento.` },
            { id: "less",      notation: `p_{${A}} < p_{${B}}`, prose: `${A} presenta menor proporción del evento.` },
          ]};
        if (dvType === "nominal") return {
          parameter: "Independencia",
          h0: { notation: "VD ⊥ Grupo", prose: `La distribución de categorías es independiente del grupo.` },
          alternatives: [
            { id: "bilateral", notation: "VD no ⊥ Grupo", prose: `Hay asociación entre la VD y el grupo.` },
          ]};
      }
    }
  }

  // RELACIÓN
  if (objective === "relacion") {
    if (dvType === "continua" && !nonNormal) return {
      parameter: "ρ (Pearson, correlación poblacional)",
      h0: { notation: "ρ = 0", prose: `No existe correlación lineal entre ${A} y ${B}.` },
      alternatives: [
        { id: "bilateral", notation: "ρ ≠ 0", prose: `Existe correlación lineal entre ${A} y ${B}.` },
        { id: "greater",   notation: "ρ > 0", prose: `La correlación es positiva: a mayor ${A}, mayor ${B}.` },
        { id: "less",      notation: "ρ < 0", prose: `La correlación es negativa: a mayor ${A}, menor ${B}.` },
      ]};
    if ((dvType === "continua" && nonNormal) || dvType === "ordinal") return {
      parameter: "ρ_s (Spearman)",
      h0: { notation: "ρ_s = 0", prose: `No existe relación monotónica entre ${A} y ${B}.` },
      alternatives: [
        { id: "bilateral", notation: "ρ_s ≠ 0", prose: `Existe relación monotónica entre ${A} y ${B}.` },
        { id: "greater",   notation: "ρ_s > 0", prose: `Relación monotónica positiva.` },
        { id: "less",      notation: "ρ_s < 0", prose: `Relación monotónica negativa.` },
      ]};
    if (dvType === "dicotomica") return {
      parameter: "r_pb (correlación punto-biserial)",
      h0: { notation: "r_pb = 0", prose: `La variable dicotómica ${A} no se relaciona con ${B}.` },
      alternatives: [
        { id: "bilateral", notation: "r_pb ≠ 0", prose: `${A} y ${B} están relacionadas.` },
        { id: "greater",   notation: "r_pb > 0", prose: `La categoría "1" de ${A} se asocia con valores mayores de ${B}.` },
        { id: "less",      notation: "r_pb < 0", prose: `La categoría "1" de ${A} se asocia con valores menores de ${B}.` },
      ]};
    if (dvType === "nominal") return {
      parameter: "Independencia",
      h0: { notation: `${A} ⊥ ${B}`, prose: `${A} y ${B} son independientes.` },
      alternatives: [
        { id: "bilateral", notation: `${A} asociada con ${B}`, prose: `Existe asociación entre ${A} y ${B}.` },
      ]};
  }

  // PREDECIR
  if (objective === "predecir") {
    if (dvType === "continua") return {
      parameter: "β₁ (coeficiente de regresión)",
      h0: { notation: "β₁ = 0", prose: `${A} no predice ${B}.` },
      alternatives: [
        { id: "bilateral", notation: "β₁ ≠ 0", prose: `${A} predice ${B}.` },
        { id: "greater",   notation: "β₁ > 0", prose: `A mayor ${A}, mayor ${B}.` },
        { id: "less",      notation: "β₁ < 0", prose: `A mayor ${A}, menor ${B}.` },
      ]};
    if (dvType === "dicotomica") return {
      parameter: "OR (odds ratio)",
      h0: { notation: "OR = 1  (β = 0)", prose: `${A} no modifica las probabilidades de ${B}.` },
      alternatives: [
        { id: "bilateral", notation: "OR ≠ 1", prose: `${A} se asocia con la probabilidad de ${B}.` },
        { id: "greater",   notation: "OR > 1", prose: `${A} aumenta la probabilidad del evento.` },
        { id: "less",      notation: "OR < 1", prose: `${A} disminuye la probabilidad del evento.` },
      ]};
    if (dvType === "ordinal") return {
      parameter: "OR acumulado (logit proporcional)",
      h0: { notation: "OR = 1", prose: `${A} no afecta las categorías ordenadas de ${B}.` },
      alternatives: [
        { id: "bilateral", notation: "OR ≠ 1", prose: `${A} modifica la probabilidad de categorías superiores.` },
        { id: "greater",   notation: "OR > 1", prose: `${A} aumenta la probabilidad de categorías superiores.` },
        { id: "less",      notation: "OR < 1", prose: `${A} disminuye la probabilidad de categorías superiores.` },
      ]};
    if (dvType === "nominal") return {
      parameter: "β_j (logit multinomial)",
      h0: { notation: "β_j = 0  ∀ j", prose: `${A} no afecta la pertenencia a ninguna categoría de ${B}.` },
      alternatives: [
        { id: "bilateral", notation: "∃ j : β_j ≠ 0", prose: `${A} afecta la pertenencia a al menos una categoría.` },
      ]};
    if (dvType === "conteo") return {
      parameter: "IRR (incidence rate ratio)",
      h0: { notation: "IRR = 1  (β = 0)", prose: `${A} no afecta la tasa de ${B}.` },
      alternatives: [
        { id: "bilateral", notation: "IRR ≠ 1", prose: `${A} modifica la tasa de ${B}.` },
        { id: "greater",   notation: "IRR > 1", prose: `${A} aumenta la tasa de ${B}.` },
        { id: "less",      notation: "IRR < 1", prose: `${A} reduce la tasa de ${B}.` },
      ]};
    if (dvType === "tiempo") return {
      parameter: "HR (hazard ratio)",
      h0: { notation: "HR = 1  (β = 0)", prose: `${A} no afecta el riesgo del evento.` },
      alternatives: [
        { id: "bilateral", notation: "HR ≠ 1", prose: `${A} modifica el riesgo del evento.` },
        { id: "greater",   notation: "HR > 1", prose: `${A} aumenta el riesgo del evento.` },
        { id: "less",      notation: "HR < 1", prose: `${A} reduce el riesgo del evento.` },
      ]};
  }

  // ASOCIACIÓN CATEGÓRICAS
  if (objective === "asociacion_cat") return {
    parameter: "Independencia",
    h0: { notation: `${A} ⊥ ${B}`, prose: `${A} y ${B} son independientes.` },
    alternatives: [
      { id: "bilateral", notation: `${A} asociada con ${B}`, prose: `Existe asociación entre ${A} y ${B}.` },
    ]};

  // SUPERVIVENCIA
  if (objective === "supervivencia") return {
    parameter: "S(t) — función de supervivencia",
    h0: { notation: `S_{${A}}(t) = S_{${B}}(t)`, prose: `Las curvas de supervivencia de ${A} y ${B} son iguales.` },
    alternatives: [
      { id: "bilateral", notation: `S_{${A}}(t) ≠ S_{${B}}(t)`, prose: `Las curvas de supervivencia difieren entre grupos.` },
    ]};

  // MULTIVARIANTE
  if (objective === "multivariante") return {
    parameter: "𝛍 (vector de medias)",
    h0: { notation: `𝛍_{${A}} = 𝛍_{${B}}`, prose: `Los vectores de medias de las VDs son iguales entre grupos.` },
    alternatives: [
      { id: "bilateral", notation: `𝛍_{${A}} ≠ 𝛍_{${B}}`, prose: `Los vectores de medias difieren entre grupos.` },
    ]};

  return null;
}

/* ============================================================
   COMPONENTES UI

function Field({ label, children, hint }) {
  return (
    <div>
      <div className="label mb-1.5">{label}</div>
      {children}
      {hint && <div className="text-xs text-[color:var(--muted)] mt-1">{hint}</div>}
    </div>
  );
}

function Select({ value, onChange, options, placeholder }) {
  return (
    <select value={value} onChange={e => onChange(e.target.value)}>
      <option value="">{placeholder || "Selecciona…"}</option>
      {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
    </select>
  );
}

function TestCard({ item, idx }) {
  const t = TESTS[item.key];
  if (!t) return null;
  const isPrincipal = item.level === "principal";
  return (
    <div className="card p-5 rounded fade-in" style={{animationDelay:`${idx*40}ms`}}>
      <div className="flex items-start justify-between gap-4">
        <div>
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-[11px] mono uppercase tracking-wider text-[color:var(--muted)]">{t.family}</span>
            <span className={`text-[10px] mono uppercase tracking-wider px-1.5 py-0.5 rounded ${isPrincipal ? 'bg-[color:var(--ink)] text-[color:var(--paper)]' : 'chip text-[color:var(--ink-soft)]'}`}>
              {isPrincipal ? "Principal" : "Alternativa"}
            </span>
          </div>
          <h3 className="serif text-2xl font-medium mt-1.5 leading-tight">{t.name}</h3>
        </div>
        <span className="serif text-3xl text-[color:var(--accent)] num leading-none mt-1">{String(idx+1).padStart(2,'0')}</span>
      </div>

      <p className="text-sm text-[color:var(--ink-soft)] mt-3">{item.why}</p>

      <div className="text-sm mt-4 pt-4 border-t rule">
        <span className="serif italic text-[color:var(--muted)]">¿Para qué sirve?</span>
        <p className="mt-1">{t.purpose}</p>
      </div>

      {t.assumptions && t.assumptions.length > 0 && (
        <details className="mt-3 group">
          <summary className="text-sm font-medium flex items-center gap-2">
            <span className="text-[color:var(--accent)]">▸</span>
            Supuestos que debes verificar
          </summary>
          <ul className="mt-2 pl-5 space-y-1 text-sm text-[color:var(--ink-soft)]">
            {t.assumptions.map((a,i) => <li key={i} className="list-disc marker:text-[color:var(--accent)]">{a}</li>)}
          </ul>
        </details>
      )}

      <details className="mt-2 group">
        <summary className="text-sm font-medium flex items-center gap-2">
          <span className="text-[color:var(--accent)]">▸</span>
          Ruta en SPSS
        </summary>
        <ol className="mt-2 pl-5 space-y-1 text-sm mono text-[color:var(--ink-soft)]">
          {t.spss.map((s,i) => <li key={i} className="list-decimal">{s}</li>)}
        </ol>
        {t.jamovi && t.jamovi !== "—" && (
          <p className="text-xs mt-2 text-[color:var(--muted)]"><span className="serif italic">Jamovi:</span> {t.jamovi}</p>
        )}
        {t.effect && t.effect !== "—" && (
          <p className="text-xs mt-1 text-[color:var(--muted)]"><span className="serif italic">Tamaño de efecto sugerido:</span> {t.effect}</p>
        )}
      </details>
    </div>
  );
}

function HypothesisBuilder({ state, labelA, setLabelA, labelB, setLabelB, direction, setDirection }) {
  const labels = getLabelNames(state);
  const h = buildHypotheses(state, { a: labelA || labels.a, b: labelB || labels.b });

  // Si la selección actual ya no está entre las alternativas, limpiarla.
  useEffect(() => {
    if (direction && (!h || !h.alternatives.find(a => a.id === direction))) setDirection("");
  }, [h ? h.alternatives.map(a => a.id).join("|") : "", direction]);

  if (!state.objective || !state.dvType) {
    return (
      <div className="text-sm text-[color:var(--muted)] border-l-2 border-[color:var(--accent)] pl-4 py-2">
        Define primero el <span className="font-medium text-[color:var(--ink)]">objetivo</span> y el <span className="font-medium text-[color:var(--ink)]">tipo de VD</span> para generar las hipótesis formales.
      </div>
    );
  }

  if (!h) {
    return (
      <div className="text-sm text-[color:var(--muted)] border-l-2 border-[color:var(--accent)] pl-4 py-2">
        Para esta combinación de variables, las hipótesis dependen del test específico. Completa también el número de grupos y el diseño.
      </div>
    );
  }

  return (
    <div className="space-y-6">
      <div className="grid md:grid-cols-2 gap-5">
        <Field label={labels.a}>
          <input value={labelA} onChange={e => setLabelA(e.target.value)} placeholder={labels.aPh} />
        </Field>
        <Field label={labels.b}>
          <input value={labelB} onChange={e => setLabelB(e.target.value)} placeholder={labels.bPh} />
        </Field>
      </div>

      <div className="text-xs mono uppercase tracking-wider text-[color:var(--muted)]">
        Parámetro · <span className="normal-case tracking-normal">{h.parameter}</span>
      </div>

      {/* H0 */}
      <div className="rounded p-5" style={{ background: "var(--paper-2)", border: "1px solid var(--line)" }}>
        <div className="flex items-baseline gap-3 mb-2">
          <span className="serif text-3xl font-medium text-[color:var(--ink)]">H<sub className="text-lg">0</sub></span>
          <span className="text-xs mono uppercase tracking-wider text-[color:var(--muted)]">Hipótesis nula</span>
        </div>
        <div className="serif text-2xl leading-snug text-[color:var(--ink)] num">{h.h0.notation}</div>
        <p className="text-sm text-[color:var(--ink-soft)] mt-2">{h.h0.prose}</p>
      </div>

      {/* Hα */}
      <div>
        <div className="flex items-baseline gap-3 mb-3">
          <span className="serif text-3xl font-medium text-[color:var(--ink)]">H<sub className="text-lg">a</sub></span>
          <span className="text-xs mono uppercase tracking-wider text-[color:var(--muted)]">
            {h.alternatives.length > 1 ? "Selecciona la que se ajuste a tu investigación" : "Hipótesis alterna"}
          </span>
        </div>
        <div className="space-y-2.5">
          {h.alternatives.map(alt => {
            const selected = direction === alt.id;
            const dirTag = alt.id === "bilateral" ? "Bilateral" : alt.id === "greater" ? "Unilateral derecha" : alt.id === "less" ? "Unilateral izquierda" : "Ómnibus";
            return (
              <label key={alt.id}
                className={`block rounded p-4 cursor-pointer transition-all border ${selected ? 'border-[color:var(--accent)] bg-white shadow-sm' : 'border-[color:var(--line)] hover:border-[color:var(--ink-soft)]'}`}
                style={selected ? { boxShadow: "inset 3px 0 0 var(--accent)" } : {}}
                onClick={() => setDirection(selected && h.alternatives.length > 1 ? "" : alt.id)}
              >
                <div className="flex items-start gap-3">
                  <input type="radio" className="mt-1.5 accent-[color:var(--accent)]" readOnly checked={selected} style={{width:"auto"}} />
                  <div className="flex-1">
                    <div className="flex items-center justify-between gap-2 flex-wrap">
                      <div className="serif text-xl num">{alt.notation}</div>
                      <span className="text-[10px] mono uppercase tracking-wider text-[color:var(--muted)]">{dirTag}</span>
                    </div>
                    <p className="text-sm text-[color:var(--ink-soft)] mt-1">{alt.prose}</p>
                  </div>
                </div>
              </label>
            );
          })}
        </div>
      </div>

      {direction && (
        <div className="rounded p-4 fade-in" style={{ background: "rgba(181,71,46,.08)", border: "1px dashed var(--accent-soft)" }}>
          <div className="text-xs mono uppercase tracking-wider text-[color:var(--accent)] mb-2">Hipótesis seleccionadas</div>
          <div className="serif text-base leading-relaxed">
            <div><span className="text-[color:var(--muted)]">H₀:</span> <span className="num">{h.h0.notation}</span></div>
            <div className="mt-1"><span className="text-[color:var(--muted)]">Hₐ:</span> <span className="num">{h.alternatives.find(a => a.id === direction)?.notation}</span></div>
          </div>
        </div>
      )}
    </div>
  );
}

function NormalityCard({ s }) {
  return (
    <ModuleCard tag="Supuesto · Normalidad" title="¿Qué prueba de normalidad usar según tu n?">
      <table className="mini">
        <thead><tr><th>Tamaño</th><th>Prueba recomendada</th><th>Criterio complementario</th></tr></thead>
        <tbody>
          {NORM_RANGES.map(r => (
            <tr key={r.key} className={s.sample === r.key ? "hl" : ""}>
              <td className="mono whitespace-nowrap">{r.label}{s.sample === r.key && <span className="text-[color:var(--accent)]"> ◂ tu caso</span>}</td>
              <td><b>{r.test}</b><div className="text-xs text-[color:var(--ink-soft)] mt-0.5">{r.detail}</div></td>
              <td className="mono whitespace-nowrap">{r.z}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div className="text-sm mt-4 space-y-2 text-[color:var(--ink-soft)]">
        <p><span className="serif italic text-[color:var(--ink)]">Dónde evaluarla:</span> {normalityWhere(s)}</p>

}

function ChiCard({ s }) {
  const is2x2 = s.tableSize === "2x2" || (s.objective === "comparar" && s.dvType === "dicotomica" && s.ivCount === "2");
  const isRxC = s.tableSize === "rxc" || (!is2x2 && s.objective !== "una_muestra");
  return (
    <ModuleCard tag="Supuesto · Tablas de contingencia" title="Requisitos de χ² y qué hacer si no se cumplen">
      <div className="text-sm space-y-3 text-[color:var(--ink-soft)]">
        <div>
          <div className="font-medium text-[color:var(--ink)]">1. Requisitos básicos</div>
          <ul className="pl-5 list-disc mt-1 space-y-0.5">
            <li>Cada persona aparece en una sola celda (independencia). Si son las mismas personas medidas dos veces → McNemar.</li>
            <li>Se analizan frecuencias, no porcentajes ni medias.</li>
            <li>Categorías exhaustivas y mutuamente excluyentes.</li>
          </ul>
        </div>
        <div className={s.expectedFreq ? "hl rounded p-2 -mx-2" : ""}>
          <div className="font-medium text-[color:var(--ink)]">2. Frecuencias esperadas (regla de Cochran)</div>
          <p className="mt-1">Ninguna esperada &lt; 1 y no más del 20% de celdas con esperada &lt; 5. En SPSS: <span className="mono">Tablas cruzadas → Casillas → 'Esperado'</span>.
            {s.expectedFreq === "ok" && <b className="text-[color:var(--ok)]"> Tu tabla cumple: usa χ² de Pearson.</b>}
            {s.expectedFreq === "bajo" && <b className="text-[color:var(--accent)]"> Tu tabla no cumple: ver punto 3.</b>}</p>
        </div>
        <div>
          <div className="font-medium text-[color:var(--ink)]">3. Si no se cumple</div>
          <table className="mini mt-1">
            <tbody>
              <tr className={is2x2 ? "hl" : ""}><td className="mono whitespace-nowrap">2 × 2</td><td>Prueba exacta de Fisher (SPSS la reporta automáticamente). Usa el valor bilateral salvo hipótesis direccional.</td></tr>
              <tr className={isRxC && s.objective !== "una_muestra" ? "hl" : ""}><td className="mono whitespace-nowrap">R × C</td><td>Agrupa categorías con sentido teórico, o usa Fisher-Freeman-Halton (botón 'Exactas').</td></tr>
              <tr className={s.objective === "una_muestra" ? "hl" : ""}><td className="mono whitespace-nowrap">Bondad de ajuste</td><td>Agrupa categorías o usa la prueba exacta multinomial/binomial.</td></tr>
            </tbody>
          </table>
        </div>
        {is2x2 && (
          <div>
            <div className="font-medium text-[color:var(--ink)]">Sobre la corrección de Yates</div>
            <p className="mt-1">SPSS la muestra como “Corrección de continuidad” en tablas 2×2. Es conservadora: si las esperadas son ≥ 5 reporta χ² de Pearson; si no, Fisher.</p>
          </div>
        )}
        {isRxC && s.objective !== "una_muestra" && (
          <div>
            <div className="font-medium text-[color:var(--ink)]">4. Si χ² es significativa en R × C</div>
            <p className="mt-1">Localiza la asociación con los <b>residuos tipificados corregidos</b>: |z| &gt; 1.96 indica una celda con más (o menos) casos de los esperados.</p>
          </div>
        )}
        <div>
          <div className="font-medium text-[color:var(--ink)]">Tamaño de efecto</div>
          <p className="mt-1">φ en tablas 2×2; V de Cramer en R × C. Su interpretación depende de gl* = mín(filas − 1, columnas − 1):</p>
          <table className="mini mt-1 num">
            <thead><tr><th>gl*</th><th>Pequeño</th><th>Mediano</th><th>Grande</th></tr></thead>
            <tbody>
              <tr><td>1</td><td>.10</td><td>.30</td><td>.50</td></tr>
              <tr><td>2</td><td>.07</td><td>.21</td><td>.35</td></tr>
              <tr><td>3</td><td>.06</td><td>.17</td><td>.29</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </ModuleCard>
  );
}

function PostHocCard({ advice }) {
  return (
    <ModuleCard tag="Decisión posterior · Post hoc" title={advice.title}>
      <div className="space-y-2.5">
        {advice.items.map((it, i) => (
          <div key={i} className={`rounded p-3 border ${it.rec ? "border-[color:var(--accent)] bg-white" : "border-[color:var(--line)]"}`}
               style={it.rec ? { boxShadow: "inset 3px 0 0 var(--accent)" } : {}}>
            <div className="flex items-center justify-between gap-2 flex-wrap">
              <div className="serif text-lg">{it.name}</div>
              {it.rec && <span className="text-[10px] mono uppercase tracking-wider text-[color:var(--accent)]">Recomendada para tu caso</span>}
            </div>
            <p className="text-sm text-[color:var(--ink-soft)] mt-0.5">{it.when}</p>
            <p className="text-xs mono text-[color:var(--muted)] mt-1">{it.spss}</p>
          </div>
        ))}
      </div>
      <ul className="mt-4 pl-5 list-disc text-xs text-[color:var(--ink-soft)] space-y-1">
        {advice.notes.map((n, i) => <li key={i}>{n}</li>)}

}

function Roadmap({ steps }) {
  return (
    <div className="card rounded p-6 md:p-8">
      <div className="flex items-baseline justify-between mb-5">
        <h2 className="serif text-2xl font-medium marker">Ruta de análisis para tu caso</h2>
        <span className="text-xs mono text-[color:var(--muted)]">En este orden</span>
      </div>
      <ol className="relative">
        {steps.map((st, i) => (
          <li key={i} className="flex gap-4 pb-5 last:pb-0 relative">
            {i < steps.length - 1 && <span className="absolute left-[15px] top-8 bottom-0 w-px bg-[color:var(--line)]"></span>}
            <span className="shrink-0 w-8 h-8 rounded-full flex items-center justify-center mono text-xs bg-[color:var(--ink)] text-[color:var(--paper)] relative">{i + 1}</span>
            <div className="pt-1">
              <div className="font-medium">{st.title}</div>
              <p className="text-sm text-[color:var(--ink-soft)] mt-0.5">{st.detail}</p>
            </div>
          </li>
        ))}
      </ol>
    </div>

}

/* ============================================================
   MODO GUIADO
   ============================================================ */
function GuidedMode({ raw, setRaw, resolved }) {
  const { clean, steps } = resolved;
  const answered = steps.filter(st => clean[st.field]);
  const current = steps.find(st => !clean[st.field]);

  const clearFrom = (st, base) => {
    const next = { ...base };
    STEPS.slice(STEPS.indexOf(st)).forEach(x => { next[x.field] = ""; });
    return next;
  };
  const answer = (st, v) => {
    const next = clearFrom(st, raw);
    next[st.field] = v;
    setRaw(next);
  };
  const goTo = st => setRaw(clearFrom(st, raw));
  const back = () => { if (answered.length) goTo(answered[answered.length - 1]); };
  const pct = Math.round(100 * answered.length / Math.max(steps.length, 1));

  return (
    <div className="card rounded p-6 md:p-8">
      <div className="flex items-baseline justify-between mb-2">
        <h2 className="serif text-2xl font-medium marker">Decide paso a paso</h2>
        <span className="text-xs mono text-[color:var(--muted)]">{current ? `Pregunta ${answered.length + 1}` : "Ruta completa"}</span>
      </div>
      <div className="h-1 rounded bg-[color:var(--paper-2)] mb-6 overflow-hidden">
        <div className="h-full bg-[color:var(--accent)] transition-all" style={{ width: `${current ? pct : 100}%` }}></div>
      </div>

      {current ? (
        <div className="fade-in" key={current.field}>
          <h3 className="serif text-2xl leading-snug">{getText(current.q, clean)}</h3>
          {current.help && <div className="text-sm text-[color:var(--ink-soft)] mt-2 border-l-2 border-[color:var(--accent-soft)] pl-3">{getText(current.help, clean)}</div>}
          <div className="grid sm:grid-cols-2 gap-2.5 mt-5">
            {getOpts(current, clean).map(o => (
              <button key={o.value} className="opt" onClick={() => answer(current, o.value)}>
                <div className="font-medium">{o.label}</div>
                {o.desc && <div className="text-xs text-[color:var(--ink-soft)] mt-0.5">{o.desc}</div>}
              </button>
            ))}
          </div>
          {answered.length > 0 && (
            <button onClick={back} className="mt-5 text-sm text-[color:var(--muted)] hover:text-[color:var(--accent)]">← Pregunta anterior</button>
          )}
        </div>
      ) : (
        <div className="fade-in text-sm border-l-2 border-[color:var(--ok)] pl-4 py-1">
          <div className="font-medium text-[color:var(--ok)]">Ruta completa.</div>
          <div className="text-[color:var(--ink-soft)]">Revisa las sugerencias, la ruta de análisis y los supuestos. Puedes cambiar cualquier respuesta abajo.</div>
        </div>
      )}

      {answered.length > 0 && (
        <div className="mt-7 pt-5 border-t rule">
          <div className="label mb-2">Tu ruta de decisión</div>
          <ol className="space-y-1.5">
            {answered.map((st, i) => (
              <li key={st.field} className="flex items-center gap-3 text-sm">
                <span className="mono text-xs text-[color:var(--accent)] w-5">{String(i + 1).padStart(2, "0")}</span>
                <span className="text-[color:var(--muted)] w-44 shrink-0">{st.short}</span>
                <span className="flex-1 font-medium">{optLabel(st, clean, clean[st.field])}</span>
                <button onClick={() => goTo(st)} className="text-xs text-[color:var(--muted)] hover:text-[color:var(--accent)] underline underline-offset-2">cambiar</button>
              </li>
            ))}
          </ol>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   MODO FORMULARIO
   ============================================================ */
function FormMode({ raw, setRaw, resolved }) {
  const { clean, steps } = resolved;
  return (
    <div className="card rounded p-6 md:p-8">
      <div className="flex items-baseline justify-between mb-2">
        <h2 className="serif text-2xl font-medium marker">Características del diseño</h2>
        <span className="text-xs mono text-[color:var(--muted)]">Paso 2</span>
      </div>
      <p className="text-xs text-[color:var(--muted)] mb-6">Los campos aparecen conforme se vuelven relevantes para tu caso.</p>
      <div className="grid md:grid-cols-2 gap-5">
        {steps.map(st => (
          <div key={st.field} className="fade-in">
            <Field label={st.short}>
              <Select value={clean[st.field] || ""} onChange={v => setRaw({ ...raw, [st.field]: v })} options={getOpts(st, clean)} />
            </Field>
          </div>
        ))}
      </div>
    </div>
  );
}

const READER_ORDER = ["normalidad", "levene_t", "anova", "rm", "t_pareada", "noparam", "chi", "correlacion", "regresion", "logistica"];

function readersFor(s, results) {
  const keys = results.map(r => r.key);
  const has = (...k) => k.some(x => keys.includes(x));
  const out = [];
  if (contPath(s) || (s.objective === "predecir" && s.dvType === "continua")) out.push("normalidad");
  if (has("t_independientes", "t_welch")) out.push("levene_t");
  if (has("anova_una_via", "welch_anova", "anova_factorial", "ancova")) out.push("anova");
  if (has("rm_anova")) out.push("rm");
  if (has("t_pareada")) out.push("t_pareada");
  if (has("mann_whitney", "wilcoxon_pareado", "kruskal_wallis", "friedman", "wilcoxon_una_muestra", "signos")) out.push("noparam");
  if (has("chi_independencia", "fisher", "chi_bondad", "z_proporciones")) out.push("chi");
  if (has("pearson", "spearman", "kendall", "parcial", "punto_biserial")) out.push("correlacion");
  if (has("reg_lineal_simple", "reg_lineal_multiple", "reg_jerarquica")) out.push("regresion");
  if (has("reg_logistica_bin")) out.push("logistica");
  return READER_ORDER.filter(k => out.includes(k));
}

function Badge({ n }) {
  return <span className="badge">{n}</span>;
}

function SpssTable({ tb }) {
  const cell = (c, i, isHead) => {
    if (isHead) {
      return <th key={i} colSpan={c.cs || 1} rowSpan={c.rs || 1}>{c.t}{c.sup && <sup>{c.sup}</sup>}</th>;
    }
    const o = typeof c === "string" ? { v: c } : c;
    const long = typeof o.v === "string" && o.v.length > 24;
    const cls = [o.th ? "rl" : (long ? "wrap" : "num-c"), o.m ? "mk" : ""].join(" ");
    return (
      <td key={i} className={cls} colSpan={o.cs || 1} rowSpan={o.rs || 1}>
        {o.v}{o.m && <Badge n={o.m} />}
      </td>
    );
  };
  return (
    <div className="spss-wrap">
      <div className="spss-cap">{tb.caption}</div>
      <div className="overflow-x-auto">
        <table className="spss">
          <thead>{tb.head.map((r, i) => <tr key={i}>{r.map((c, j) => cell(c, j, true))}</tr>)}</thead>
          <tbody>{tb.rows.map((r, i) => <tr key={i}>{r.map((c, j) => cell(c, j, false))}</tr>)}</tbody>
        </table>
      </div>
      {tb.foot && (
        <div className="spss-foot">
          {tb.foot.map((f, i) => typeof f === "string"
            ? <div key={i}>{f}</div>
            : <div key={i} className="mk inline-block">{f.v}<Badge n={f.m} /></div>)}
        </div>
      )}
    </div>
  );
}

  const r = READERS[id];
  return (

          <div className="serif text-xl font-medium leading-tight">{r.title}</div>
        </div>
        <span className="text-[color:var(--accent)] text-lg">▾</span>
      </summary>
      <div className="px-6 pb-6">
        <p className="text-xs mono text-[color:var(--muted)] mb-4">{r.menu}</p>
        <div className="grid xl:grid-cols-5 gap-6">
          <div className="xl:col-span-3 space-y-4">
            {r.tables.map((tb, i) => <SpssTable key={i} tb={tb} />)}
            <p className="text-[11px] text-[color:var(--muted)]">Datos de ejemplo. Los rótulos pueden variar ligeramente según la versión de SPSS; en algunas configuraciones el separador decimal es coma.</p>
          </div>
          <div className="xl:col-span-2 space-y-3">
            <ol className="space-y-2.5">
              {r.notes.map(n => (
                <li key={n.m} className="flex gap-2.5 text-sm text-[color:var(--ink-soft)]">
                  <Badge n={n.m} /><span>{n.t}</span>
                </li>
              ))}
            </ol>
            {r.extra && <p className="text-xs text-[color:var(--ink-soft)] border-l-2 border-[color:var(--line)] pl-3">{r.extra}</p>}
            <div className="rounded p-3" style={{ background: "var(--paper-2)" }}>
              <div className="label mb-1">Decisión</div>
              <p className="text-sm">{r.decide}</p>
            </div>
            <div className="rounded p-3" style={{ background: "rgba(181,71,46,.08)", border: "1px dashed var(--accent-soft)" }}>

              <p className="text-sm serif">{r.apa}</p>

}

function SpssKeys() {
  return (
    <div className="card rounded p-6">
      <div className="text-[11px] mono uppercase tracking-wider text-[color:var(--accent)]">Antes de leer cualquier tabla</div>
      <h3 className="serif text-2xl font-medium mt-1 mb-4">Cinco claves de la salida de SPSS</h3>
      <div className="grid md:grid-cols-2 gap-4 text-sm text-[color:var(--ink-soft)]">
        <div><b className="text-[color:var(--ink)]">1. “Sig.” es el valor p.</b> Se compara con α = .05: p ≤ .05 → se rechaza H₀.</div>
        <div><b className="text-[color:var(--ink)]">2. “.000” no es cero.</b> SPSS redondea a tres decimales: repórtalo como p &lt; .001.</div>
        <div><b className="text-[color:var(--ink)]">3. En los supuestos quieres p &gt; .05.</b> En normalidad, Levene, Mauchly y Hosmer-Lemeshow la H₀ dice que el supuesto se cumple; un p no significativo es la buena noticia.</div>
        <div><b className="text-[color:var(--ink)]">4. En tu prueba principal, p ≤ .05 apoya tu Hₐ.</b> Pero revisa siempre el tamaño de efecto: significativo no es lo mismo que importante.</div>
        <div><b className="text-[color:var(--ink)]">5. Los gl se reportan.</b> Entre paréntesis después del estadístico: t(56), F(2, 87), χ²(1, N = 80), r(62).</div>
        <div><b className="text-[color:var(--ink)]">Formato APA.</b> Estadísticos en cursiva; sin cero inicial en valores que no pueden pasar de 1 (p, r, β, η²): p = .023, no 0.023.</div>
      </div>
    </div>
  );
}
