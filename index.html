        <h2 className="serif text-3xl font-medium">Cómo leer la salida de SPSS</h2>
        <div className="flex items-center gap-3">
          {ready && ids.length > 0 && (
            <button onClick={() => setAll(!all)} className="text-xs chip rounded px-3 py-1.5 hover:bg-[color:var(--paper)]">
              {all ? "Mostrar solo las de mi caso" : "Ver todas las guías"}
            </button>
          )}
          <span className="text-xs mono text-[color:var(--muted)]">Paso 6</span>
        </div>
      </div>
      <div className="space-y-5">
        <SpssKeys />
        {show.map(id => <SpssReader key={id + (all ? "a" : "c")} id={id} open={ready && ids.includes(id) && !all} />)}
      </div>
    </section>
  );
}


/* ============================================================
   MODO ESTADÍSTICA DESCRIPTIVA
   ============================================================ */
const DOPT = {
  dObj: [
    { value: "una", label: "Una variable a la vez", desc: "Ej.: edad, sexo, nivel de dolor, número de consultas." },
    { value: "dos", label: "Dos variables juntas", desc: "Comparar grupos o ver cómo se relacionan, sin probar hipótesis." },
  ],
  dType: [
    { value: "nominal", label: "Nominal", desc: "Categorías sin orden: sexo, carrera, tipo de diagnóstico." },
    { value: "ordinal", label: "Ordinal", desc: "Categorías ordenadas: nivel de dolor, un ítem Likert, nivel socioeconómico." },
    { value: "discreta", label: "Cuantitativa discreta", desc: "Conteos con valores enteros: número de hijos, consultas al año." },
    { value: "continua", label: "Cuantitativa continua", desc: "Mediciones: edad, peso, presión arterial, puntaje total de una escala." },
  ],
  dPair: [
    { value: "catcat", label: "Categórica × categórica", desc: "Ej.: sexo y especialidad elegida; turno y burnout (sí/no)." },
    { value: "cuantcat", label: "Cuantitativa por grupos", desc: "Ej.: estrés según turno; glucosa según tratamiento." },
    { value: "cuantcuant", label: "Cuantitativa × cuantitativa", desc: "Ej.: horas de sueño y estrés; IMC y presión arterial." },
  ],
  dValues: [
    { value: "pocos", label: "Pocos valores distintos", desc: "Unos 15 o menos (0, 1, 2, 3…)." },
    { value: "muchos", label: "Muchos valores distintos", desc: "Conviene agruparlos en intervalos." },
  ],
  dShape: [
    { value: "simetrica", label: "Aproximadamente simétrica", desc: "Histograma en forma de campana, sin atípicos extremos." },
    { value: "asimetrica", label: "Asimétrica o con atípicos", desc: "Una cola larga hacia un lado, o valores muy alejados." },
    { value: "nose", label: "Aún no lo sé", desc: "Te diremos cómo revisarlo." },
  ],
};

const isQuant = d => ["discreta", "continua"].includes(d.dType) || ["cuantcat", "cuantcuant"].includes(d.dPair);

const DSTEPS = [
  { field: "dObj", short: "Qué describes", q: "¿Qué quieres describir?", help: "La estadística descriptiva resume y presenta los datos de tu muestra; no generaliza a la población.", options: DOPT.dObj, when: () => true },
  { field: "dType", short: "Tipo de variable", q: "¿Qué tipo de variable es?", help: "El nivel de medición decide qué tablas, gráficas y medidas son válidas.", options: DOPT.dType, when: d => d.dObj === "una" },
  { field: "dPair", short: "Combinación", q: "¿Qué tipo de variables combinas?", help: "Si una variable define grupos (sexo, turno, tratamiento), es la categórica.", options: DOPT.dPair, when: d => d.dObj === "dos" },
  { field: "dValues", short: "Valores distintos", q: "¿Cuántos valores distintos toma tu variable?", help: "Decide si la tabla de frecuencias lleva cada valor o intervalos.", options: DOPT.dValues, when: d => d.dType === "discreta" },
  { field: "dShape", short: "Forma", q: "¿Cómo es la forma de la distribución?",
    help: () => <span>Revísalo con un histograma y la z de asimetría (asimetría ÷ su error estándar): |z| &gt; 1.96 con n &lt; 50, o &gt; 3.29 con n entre 50 y 300, indica asimetría. En SPSS: <span className="mono">Frecuencias → Estadísticos → Asimetría</span> y <span className="mono">Gráficos → Histogramas</span>.</span>,
    options: DOPT.dShape, when: d => isQuant(d) && (d.dType !== "discreta" || !!d.dValues) },
];

function dResolve(raw) {
  const clean = {}; const steps = [];
  for (const st of DSTEPS) {
    if (st.when(clean)) {
      steps.push(st);
      const v = raw[st.field];
      if (v && getOpts(st, clean).some(o => o.value === v)) clean[st.field] = v;
    }
  }
  return { clean, steps };
}

/* ---------- recomendaciones ---------- */
function descAdvice(d) {
  const S = []; // secciones
  const sec = (title, items) => S.push({ title, items });
  const it = (name, why, spss, icon, rec = true) => ({ name, why, spss, icon, rec });
  const avoid = []; const notes = []; let report = "";
  const sym = d.dShape === "simetrica", asym = d.dShape === "asimetrica", unk = !d.dShape || d.dShape === "nose";

  const quantMeasures = () => {
    sec("Tendencia central", [
      it("Media", sym ? "Con distribución simétrica es la medida más informativa." : asym ? "Solo como complemento: los valores extremos la arrastran hacia la cola." : "Úsala como principal si la distribución resulta simétrica.", "Frecuencias → Estadísticos → Media", null, sym || unk),
      it("Mediana", asym ? "El valor central; no se deja arrastrar por atípicos ni por la asimetría." : "Repórtala también: si se aleja mucho de la media, hay asimetría.", "Frecuencias → Estadísticos → Mediana", null, asym || unk),
      it("Moda", "Útil en variables discretas o para señalar distribuciones con dos picos (bimodales).", "Frecuencias → Estadísticos → Moda", null, false),
    ]);
    sec("Dispersión", [
      it("Desviación estándar (y varianza)", sym ? "Distancia promedio de los datos a la media; acompaña siempre a la media." : "Acompaña a la media; con asimetría fuerte, el RIC describe mejor.", "Frecuencias → Estadísticos → Desviación típica, Varianza", null, sym || unk),
      it("Rango intercuartílico (RIC)", "RIC = P75 − P25: la amplitud de la mitad central de los datos; acompaña a la mediana.", "Frecuencias → Estadísticos → Cuartiles (resta P75 − P25)", null, asym || unk),
      it("Rango (mínimo–máximo)", "Muestra los extremos; muy sensible a atípicos, por eso no se usa solo.", "Frecuencias → Estadísticos → Rango, Mínimo, Máximo", null, true),
      it("Coeficiente de variación", "CV = DE ÷ media × 100. Compara la variabilidad de variables con distinta escala. Solo en variables de razón (con cero absoluto).", "Calcúlalo a mano con la media y la DE", null, false),
    ]);
  };
  const quantPosition = () => {
    sec("Posición", [
      it("Cuartiles y percentiles", "P25, P50 (= mediana) y P75; o cualquier percentil (p. ej., P90 para valores de corte).", "Frecuencias → Estadísticos → Cuartiles / Percentiles", null, true),
      it("Puntajes z", "z = (x − media) ÷ DE: ubica a cada caso respecto al grupo. |z| > 3.29 sugiere un atípico.", "Descriptivos → marcar 'Guardar valores tipificados como variables'", null, sym || unk),
    ]);
    sec("Forma", [
      it("Asimetría y curtosis", "Divide cada una entre su error estándar: |z| > 1.96 (n < 50) o > 3.29 (n de 50 a 300) indica desviación. Asimetría positiva = cola a la derecha.", "Frecuencias → Estadísticos → Asimetría, Curtosis", null, true),
      it("Atípicos en el diagrama de caja", "Círculos: valores a más de 1.5 RIC de la caja; asteriscos: a más de 3 RIC (extremos).", "Explorar → Gráficos → Diagramas de caja", null, true),
    ]);
  };

  if (d.dObj === "una" && d.dType === "nominal") {
    sec("Tabla", [it("Tabla de frecuencias (n y %)", "Ordena las categorías de mayor a menor frecuencia. Si hay datos perdidos, reporta el porcentaje válido.", "Analizar → Estadísticos descriptivos → Frecuencias", "table")]);
    sec("Gráfica", [
      it("Gráfico de barras", "Compara categorías con precisión. Deja espacio entre barras: son categorías separadas.", "Frecuencias → Gráficos → Gráficos de barras", "bar"),
      it("Gráfico circular (pastel)", "Solo con pocas categorías (5 o menos) que sumen 100%: el ojo compara mal los ángulos.", "Frecuencias → Gráficos → Gráficos circulares", "pie", false),
    ]);
    sec("Tendencia central", [it("Moda", "Es la única medida válida en nominal: la categoría más frecuente.", "Frecuencias → Estadísticos → Moda")]);
    sec("Dispersión", [it("% de la categoría modal y número de categorías", "Indican qué tan concentrados están los casos. Opcional: índice de variación cualitativa (IVQ, de 0 a 1).", "Se lee en la tabla de frecuencias")]);
    sec("Posición", [it("No aplica", "Sin orden entre categorías no existen percentiles ni cuartiles.", "—", null, false)]);
    avoid.push("Media, mediana o desviación estándar de los códigos numéricos (p. ej., 1 = hombre, 2 = mujer): el promedio de códigos no significa nada.", "Histogramas: son para variables cuantitativas.");
    report = "La mayoría de los participantes eran mujeres (n = 64; 71.1%), seguidas de hombres (n = 24; 26.7%); 2.2% no respondió.";
  }

  else if (d.dObj === "una" && d.dType === "ordinal") {
    sec("Tabla", [it("Tabla de frecuencias con % acumulado", "Respeta el orden natural de las categorías (no las ordenes por frecuencia). El acumulado permite ubicar la mediana.", "Analizar → Estadísticos descriptivos → Frecuencias", "table")]);
    sec("Gráfica", [
      it("Gráfico de barras en orden", "Las barras siguen el orden de la escala (nada → muchísimo).", "Frecuencias → Gráficos → Gráficos de barras", "bar"),
      it("Barras apiladas al 100%", "Ideal para comparar varios ítems Likert que comparten la misma escala.", "Gráficos → Generador de gráficos → Barras apiladas", "stacked", false),
    ]);
    sec("Tendencia central", [
      it("Mediana", "La categoría donde el porcentaje acumulado alcanza el 50%.", "Frecuencias → Estadísticos → Mediana"),
      it("Moda", "La categoría más frecuente; complementa a la mediana.", "Frecuencias → Estadísticos → Moda", null, false),
    ]);
    sec("Dispersión", [
      it("Rango intercuartílico (RIC)", "De la categoría del P25 a la del P75: la mitad central de las respuestas.", "Frecuencias → Estadísticos → Cuartiles"),
      it("Rango", "De la categoría más baja a la más alta observada.", "Frecuencias → Estadísticos → Mínimo, Máximo", null, false),
    ]);
    sec("Posición", [it("Cuartiles y percentiles", "Indican qué categoría marca cada cuarto de la muestra.", "Frecuencias → Estadísticos → Cuartiles / Percentiles")]);
    avoid.push("Media y DE de un solo ítem ordinal: suponen distancias iguales entre categorías. Si la reportas por convención, acompáñala de la mediana.", "Ordenar las barras por frecuencia: se pierde la información del orden.");
    notes.push("Si sumas varios ítems para formar el puntaje total de una escala, ese puntaje suele tratarse como cuantitativo: elige “Cuantitativa continua”.");
    report = "La mediana del nivel de dolor fue “moderado” (RIC: poco–mucho); 36.0% de los pacientes se ubicó en esa categoría.";
  }

  else if (d.dObj === "una" && isQuant(d)) {
    const grouped = d.dType === "continua" || d.dValues === "muchos";
    sec("Tabla", [grouped
      ? it("Tabla de frecuencias agrupada en intervalos", "Número de intervalos con la regla de Sturges: k = 1 + 3.322 · log₁₀(n); amplitud = rango ÷ k. Con n = 100 → unos 8 intervalos.", "Transformar → Agrupación visual (crea la variable agrupada) → Frecuencias", "table")
      : it("Tabla de frecuencias simple", "Cada valor en su renglón (0, 1, 2, 3…) con n, % y % acumulado.", "Analizar → Estadísticos descriptivos → Frecuencias", "table"),
      it("Tabla de estadísticos descriptivos", "n, media, DE, mediana, RIC, mínimo y máximo en una sola tabla.", "Frecuencias → Estadísticos (o Explorar)", "table", true)]);
    sec("Gráfica", [
      grouped
        ? it("Histograma", "Muestra la forma: simetría, sesgo, picos. Las barras van juntas porque la escala es continua.", "Frecuencias → Gráficos → Histogramas (marcar 'Mostrar curva normal')", "hist")
        : it("Gráfico de barras (bastones)", "Con pocos valores enteros, cada barra representa un valor.", "Frecuencias → Gráficos → Gráficos de barras", "bar"),
      it("Diagrama de caja y bigotes", "Resume mediana, cuartiles y atípicos en una sola figura.", "Explorar → Gráficos → Diagramas de caja", "box"),
    ]);
    quantMeasures(); quantPosition();
    avoid.push("Gráfico circular o barras separadas para valores continuos.");
    if (!sym) avoid.push("Reportar solo la media cuando hay asimetría: los valores extremos la desplazan.", "Media ± DE cuando la DE es mayor que la media en una variable que no puede ser negativa: es señal de asimetría fuerte.");
    report = asym
      ? "El tiempo de traslado mostró asimetría positiva; mediana = 45 min (RIC: 30–70; rango: 10–180)."
      : "La edad de los participantes tuvo una media de 21.4 años (DE = 2.3; rango: 18–29).";
  }

  else if (d.dPair === "catcat") {
    sec("Tabla", [it("Tabla de contingencia con porcentajes", "Calcula los porcentajes dentro de cada categoría de la variable que define los grupos, para comparar grupos de distinto tamaño.", "Tablas cruzadas → Casillas → Porcentajes: Fila o Columna", "table")]);
    sec("Gráfica", [
      it("Barras agrupadas", "Una barra por combinación de categorías; compara frecuencias o porcentajes.", "Gráficos → Generador de gráficos → Barras agrupadas", "grouped"),
      it("Barras apiladas al 100%", "Muestra la composición de cada grupo; muy clara para comparar porcentajes.", "Gráficos → Generador de gráficos → Barras apiladas (en %)", "stacked"),
    ]);
    sec("Medidas", [
      it("Porcentajes condicionales", "El % de una categoría dentro de cada grupo (p. ej., % con burnout en cada turno).", "Tablas cruzadas → Casillas → Porcentajes"),
      it("V de Cramer (opcional)", "Resume la intensidad de la asociación de 0 a 1, incluso sin prueba de hipótesis.", "Tablas cruzadas → Estadísticos → Phi y V de Cramer", null, false),
    ]);
    avoid.push("Comparar frecuencias absolutas entre grupos de distinto tamaño.", "Porcentajes sobre el total de la tabla cuando lo que quieres es comparar grupos.");
    report = "En el turno nocturno, 45.0% de los internos presentó burnout, frente a 22.5% en el turno diurno.";
  }

  else if (d.dPair === "cuantcat") {
    sec("Tabla", [it("Tabla de medidas por grupo", sym ? "Para cada grupo: n, media, DE, mínimo y máximo." : "Para cada grupo: n, mediana, RIC, mínimo y máximo (y la media como complemento).", "Explorar (VI en 'Lista de factores') o Comparar medias → Medias", "table")]);
    sec("Gráfica", [
      it("Diagramas de caja lado a lado", "La mejor forma de comparar distribuciones y detectar atípicos en cada grupo.", "Explorar → Gráficos → Diagramas de caja (con la VI en 'Lista de factores')", "box"),
      it("Barras de error (media ± IC 95%)", "Muestra medias y su precisión. Prefiérelo a barras de medias sin variabilidad.", "Gráficos → Generador de gráficos → Barras de error simples", "err", sym || unk),
    ]);
    sec("Medidas por grupo", [
      it(sym ? "Media y desviación estándar" : asym ? "Mediana y RIC" : "Media y DE, o mediana y RIC", sym ? "Con distribuciones simétricas en cada grupo." : asym ? "Con asimetría o atípicos en algún grupo." : "Decide tras revisar la forma de la distribución en cada grupo.", "Explorar → Estadísticos → Descriptivos"),
      it("Diferencia entre grupos", "Resta las medias (o medianas) para expresar cuánto difieren; la d de Cohen la expresa en unidades de DE.", "Calcúlala con los descriptivos de cada grupo", null, false),
    ]);
    avoid.push("Gráficos de barras de medias sin ninguna medida de variabilidad.", "Comparar grupos solo con la media si hay asimetría o atípicos.");
    report = sym || unk
      ? "El estrés fue mayor en el turno nocturno (M = 24.6, DE = 5.1) que en el diurno (M = 20.8, DE = 4.9)."
      : "El tiempo de espera fue mayor en urgencias (Mdn = 95 min, RIC: 60–150) que en consulta externa (Mdn = 40 min, RIC: 25–65).";
  }

  else if (d.dPair === "cuantcuant") {
    sec("Tabla", [it("Descriptivos de ambas variables", sym ? "n, media y DE de cada variable." : "n, mediana y RIC de cada variable.", "Frecuencias → Estadísticos, o Descriptivos", "table")]);
    sec("Gráfica", [it("Diagrama de dispersión", "Muestra forma (recta o curva), dirección, fuerza y atípicos. Hazlo siempre antes de calcular un coeficiente.", "Gráficos → Generador de gráficos → Dispersión/Puntos (agregar línea de ajuste)", "scatter")]);
    sec("Medidas de relación", [
      it("r de Pearson (descriptivo)", "Dirección y fuerza de la relación lineal: .10 débil, .30 moderada, .50 fuerte. r² = proporción de varianza compartida.", "Analizar → Correlaciones → Bivariadas → Pearson", null, sym || unk),
      it("rho de Spearman", "Relación monotónica; robusta a atípicos y asimetría.", "Analizar → Correlaciones → Bivariadas → Spearman", null, asym || unk),
    ]);
    avoid.push("Calcular r sin mirar el diagrama: una relación curva o un atípico pueden dar un r engañoso.", "Interpretar una correlación como causalidad.");
    report = "Las horas de sueño y el estrés mostraron una relación negativa moderada (r = −.41): a más horas de sueño, menor estrés.";
  }

  return { sections: S, avoid, notes, report };
}

/* ---------- tabla de referencia por nivel de medición ---------- */
function LevelMatrix({ d }) {
  const row = d.dType === "nominal" ? "nom" : d.dType === "ordinal" ? "ord" : isQuant(d) && d.dObj === "una" ? "cuant" : "";
  const rows = [
    { k: "nom", n: "Nominal", t: "Moda", di: "% categoría modal, IVQ", p: "No aplica", g: "Barras, circular (≤ 5 categorías)" },
    { k: "ord", n: "Ordinal", t: "Mediana, moda", di: "RIC, rango", p: "Cuartiles, percentiles", g: "Barras en orden, apiladas 100%" },
    { k: "cuant", n: "Intervalo / razón", t: "Media (simétrica) o mediana (asimétrica)", di: "DE, varianza, RIC, rango, CV (razón)", p: "Cuartiles, percentiles, puntajes z", g: "Histograma, caja y bigotes, barras (discreta)" },
  ];
  return (
    <div className="card rounded p-6">
      <div className="text-[11px] mono uppercase tracking-wider text-[color:var(--accent)]">Referencia rápida</div>
      <h3 className="serif text-2xl font-medium mt-1 mb-4">¿Qué medida corresponde a cada nivel de medición?</h3>
      <div className="overflow-x-auto">
        <table className="mini">
          <thead><tr><th>Nivel</th><th>Tendencia central</th><th>Dispersión</th><th>Posición</th><th>Gráficas</th></tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.k} className={row === r.k ? "hl" : ""}>
                <td className="font-medium whitespace-nowrap">{r.n}{row === r.k && <span className="text-[color:var(--accent)] text-xs"> ◂ tu caso</span>}</td>
                <td>{r.t}</td><td>{r.di}</td><td>{r.p}</td><td>{r.g}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="text-xs text-[color:var(--muted)] mt-3">Cada nivel admite también las medidas de los niveles inferiores (p. ej., en una variable de razón puedes reportar la moda), pero no las de los superiores.</p>
    </div>
  );
}

/* ---------- componente principal del modo descriptivo ---------- */
function DescriptiveMode({ draw, setDraw }) {
  const { clean: d, steps } = dResolve(draw);
  const answered = steps.filter(st => d[st.field]);
  const current = steps.find(st => !d[st.field]);
  const done = !current;
  const adv = done ? descAdvice(d) : null;

  const clearFrom = st => { const n = { ...draw }; DSTEPS.slice(DSTEPS.indexOf(st)).forEach(x => { n[x.field] = ""; }); return n; };
  const answer = (st, v) => { const n = clearFrom(st); n[st.field] = v; setDraw(n); };

  const readers = ["frecuencias", "estadisticos"].filter(k =>
    k === "frecuencias" ? (["nominal", "ordinal"].includes(d.dType) || d.dValues === "pocos" || d.dPair === "catcat") : isQuant(d));
  if (d.dPair === "cuantcuant") readers.push("correlacion");

  return (
    <>
      <div className="grid lg:grid-cols-5 gap-8 mt-10">
        <section className="lg:col-span-2 space-y-6">
          <div className="card rounded p-6 md:p-8">
            <div className="flex items-baseline justify-between mb-2">
              <h2 className="serif text-2xl font-medium marker">Describe tus datos</h2>
              <span className="text-xs mono text-[color:var(--muted)]">{done ? "Listo" : `Pregunta ${answered.length + 1}`}</span>
            </div>
            <p className="text-xs text-[color:var(--muted)] mb-5">Para estudios que solo describen la muestra, sin probar hipótesis.</p>
            {current ? (
              <div className="fade-in" key={current.field}>
                <h3 className="serif text-xl leading-snug">{getText(current.q, d)}</h3>
                <div className="text-sm text-[color:var(--ink-soft)] mt-2 border-l-2 border-[color:var(--accent-soft)] pl-3">{getText(current.help, d)}</div>
                <div className="grid gap-2.5 mt-5">
                  {getOpts(current, d).map(o => (
                    <button key={o.value} className="opt" onClick={() => answer(current, o.value)}>
                      <div className="font-medium">{o.label}</div>
                      {o.desc && <div className="text-xs text-[color:var(--ink-soft)] mt-0.5">{o.desc}</div>}
                    </button>
                  ))}
                </div>
                {answered.length > 0 && (
                  <button onClick={() => setDraw(clearFrom(answered[answered.length - 1]))} className="mt-5 text-sm text-[color:var(--muted)] hover:text-[color:var(--accent)]">← Pregunta anterior</button>
                )}
              </div>
            ) : (
              <div className="fade-in text-sm border-l-2 border-[color:var(--ok)] pl-4 py-1">
                <div className="font-medium text-[color:var(--ok)]">Listo.</div>
                <div className="text-[color:var(--ink-soft)]">Revisa las recomendaciones. Puedes cambiar cualquier respuesta.</div>
              </div>
            )}
            {answered.length > 0 && (
              <div className="mt-7 pt-5 border-t rule">
                <div className="label mb-2">Tus respuestas</div>
                <ol className="space-y-1.5">
                  {answered.map((st, i) => (
                    <li key={st.field} className="flex items-center gap-3 text-sm">
                      <span className="mono text-xs text-[color:var(--accent)] w-5">{String(i + 1).padStart(2, "0")}</span>
                      <span className="text-[color:var(--muted)] w-28 shrink-0">{st.short}</span>
                      <span className="flex-1 font-medium">{optLabel(st, d, d[st.field])}</span>
                      <button onClick={() => setDraw(clearFrom(st))} className="text-xs text-[color:var(--muted)] hover:text-[color:var(--accent)] underline underline-offset-2">cambiar</button>
                    </li>
                  ))}
                </ol>
              </div>
            )}
          </div>
          {adv && (
            <div className="rounded p-6 border border-dashed fade-in" style={{ borderColor: 'var(--accent-soft)', background: 'rgba(228,168,142,.15)' }}>
              <div className="label mb-1" style={{ color: "var(--accent)" }}>Ejemplo de redacción (APA 7)</div>
              <p className="serif text-base">{adv.report}</p>
              <p className="text-xs text-[color:var(--ink-soft)] mt-3">En APA, las medidas se escriben en cursiva (M, DE, Mdn, n) y los porcentajes con un decimal.</p>
            </div>
          )}
        </section>

        <aside className="lg:col-span-3 space-y-5">
          {!adv ? (
            <div className="card rounded p-6">
              <h2 className="serif text-2xl font-medium marker mb-3">Recomendaciones</h2>
              <div className="text-sm text-[color:var(--muted)] border-l-2 border-[color:var(--accent)] pl-4 py-2">Responde las preguntas para ver qué tabla, qué gráfica y qué medidas usar.</div>
            </div>
          ) : (
            <>
              {adv.sections.map((sx, i) => (
                <div key={i} className="card rounded p-6 fade-in" style={{ animationDelay: `${i * 40}ms` }}>
                  <div className="flex items-baseline justify-between mb-3">
                    <h3 className="serif text-2xl font-medium">{sx.title}</h3>
                    <span className="serif text-2xl text-[color:var(--accent)] num">{String(i + 1).padStart(2, "0")}</span>
                  </div>
                  <div className="space-y-2.5">
                    {sx.items.map((x, j) => (
                      <div key={j} className={`rounded p-3 border flex gap-3 ${x.rec ? "border-[color:var(--accent)] bg-white" : "border-[color:var(--line)]"}`}
                           style={x.rec ? { boxShadow: "inset 3px 0 0 var(--accent)" } : {}}>
                        {x.icon && <ChartIcon kind={x.icon} />}
                        <div className="flex-1">
                          <div className="flex items-center justify-between gap-2 flex-wrap">
                            <div className="font-medium">{x.name}</div>
                            <span className="text-[10px] mono uppercase tracking-wider text-[color:var(--muted)]">{x.rec ? "Recomendada" : "Opcional"}</span>
                          </div>
                          <p className="text-sm text-[color:var(--ink-soft)] mt-0.5">{x.why}</p>
                          {x.spss && x.spss !== "—" && <p className="text-xs mono text-[color:var(--muted)] mt-1">{x.spss}</p>}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
              {(adv.avoid.length > 0 || adv.notes.length > 0) && (
                <div className="card rounded p-6 fade-in">
                  <h3 className="serif text-xl font-medium mb-3">Evita</h3>
                  <ul className="pl-5 list-disc text-sm text-[color:var(--ink-soft)] space-y-1">
                    {adv.avoid.map((a, i) => <li key={i}>{a}</li>)}
                  </ul>
                  {adv.notes.map((n, i) => <p key={i} className="text-sm mt-3 border-l-2 border-[color:var(--warn)] pl-3 text-[color:var(--ink-soft)]">{n}</p>)}
                </div>
              )}
            </>
          )}
        </aside>
      </div>

      <section className="mt-12 space-y-5">
        <div className="flex items-baseline justify-between pb-4 border-b rule">
          <h2 className="serif text-3xl font-medium">Referencia y lectura de SPSS</h2>
          <span className="text-xs mono text-[color:var(--muted)]">Descriptiva</span>
        </div>
        <LevelMatrix d={d} />
        {(done ? readers : ["frecuencias", "estadisticos"]).map(id => <SpssReader key={id} id={id} open={done} />)}
      </section>
    </>
  );
}

const EMPTY = Object.fromEntries(STEPS.map(st => [st.field, ""]));
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

function App() {
  const [mode, setMode] = useState("guiado");
  const [raw, setRaw] = useState(EMPTY);
  const [draw, setDraw] = useState(Object.fromEntries(DSTEPS.map(st => [st.field, ""])));
  const [researchQuestion, setRQ] = useState("");
  const [iv, setIV] = useState("");
  const [dv, setDV] = useState("");
  const [labelA, setLabelA] = useState("");
  const [labelB, setLabelB] = useState("");
  const [direction, setDirection] = useState("");

  const resolved = useMemo(() => resolve(raw), [raw]);
  const s = resolved.clean;
  const complete = resolved.steps.every(st => s[st.field]);
  const ready = !!(s.objective && s.dvType && (["una_muestra", "asociacion_cat", "supervivencia", "multivariante", "relacion", "predecir"].includes(s.objective) || s.ivCount));
  const results = useMemo(() => ready ? suggestTests(s) : [], [JSON.stringify(s), ready]);
  const roadmap = useMemo(() => ready ? buildRoadmap(s, results) : [], [JSON.stringify(s), results]);
  const posthoc = ready ? postHocAdvice(s, results) : null;
  const showNorm = ready && (contPath(s) || (s.objective === "predecir" && s.dvType === "continua"));
  const showChi = ready && (isChiPath(s) || results.some(r => ["chi_independencia", "fisher", "chi_bondad"].includes(r.key)));
  const showHyp = mode === "formulario" || complete;

  const reset = () => {
    setRaw(EMPTY); setDraw(Object.fromEntries(DSTEPS.map(st => [st.field, ""]))); setRQ(""); setIV(""); setDV("");
    setLabelA(""); setLabelB(""); setDirection("");
  };

  return (
    <div className="max-w-[1300px] mx-auto px-6 md:px-10 py-10 md:py-14">

          </p>
        </div>
        <div className="no-print">
          <div className="label mb-1.5 text-right">Modo</div>
          <div className="seg inline-flex rounded border rule overflow-hidden">
            <button className={mode === "guiado" ? "on" : ""} onClick={() => setMode("guiado")}>Guiado paso a paso</button>
            <button className={mode === "formulario" ? "on" : ""} onClick={() => setMode("formulario")}>Formulario completo</button>
            <button className={mode === "descriptiva" ? "on" : ""} onClick={() => setMode("descriptiva")}>Estadística descriptiva</button>
          </div>
          <div className="text-[11px] text-[color:var(--muted)] mt-1.5 text-right">{mode === "descriptiva" ? "Tablas, gráficas y medidas, sin prueba de hipótesis." : "Tus respuestas se conservan al cambiar de modo."}</div>
        </div>
      </header>

      {mode === "descriptiva" ? <DescriptiveMode draw={draw} setDraw={setDraw} /> : (<>
      <div className="grid lg:grid-cols-5 gap-8 mt-10">

          <div className="card rounded p-6 md:p-8">

            </div>

              </Field>
              <Field label="Variable dependiente (VD)">
                <input value={dv} onChange={e => setDV(e.target.value)} placeholder="Ej.: estrés percibido (PSS-10)" />
              </Field>
            </div>
          </div>

          {mode === "guiado"
            ? <GuidedMode raw={raw} setRaw={setRaw} resolved={resolved} />
            : <FormMode raw={raw} setRaw={setRaw} resolved={resolved} />}

          {showHyp && (
            <div className="card rounded p-6 md:p-8">

                <h2 className="serif text-2xl font-medium marker">Planteamiento de hipótesis</h2>
